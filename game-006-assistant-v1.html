<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planet Clicker</title><style>*{box-sizing:border-box}body{margin:0;background:#080d26;color:#eee;font:18px system-ui}header{text-align:center;padding:20px}h1{margin:0}main{display:flex;justify-content:center;align-items:center;gap:35px;min-height:350px;padding:20px;flex-wrap:wrap}#planet{border:0;border-radius:50%;height:230px;width:230px;background:#a7a3a3;box-shadow:inset -25px -15px 30px #0007,0 0 50px #fff2;cursor:pointer;position:relative;touch-action:manipulation}#planet:active{transform:scale(.97)}button{font:inherit;background:#1d2a5a;color:white;border:1px solid #8795c6;border-radius:8px;padding:12px;margin:6px;cursor:pointer}aside{max-width:310px}aside button{display:block;width:100%}footer{text-align:center;padding:20px}textarea{display:block;margin:10px auto;width:min(90%,600px);height:70px;background:#141c3a;color:white}.particle{position:fixed;border-radius:50%;width:25px;height:25px;background:#aaa;pointer-events:none;animation:boom .5s forwards}@keyframes boom{to{transform:scale(4);opacity:0}}#score{font-size:32px}#quiz{position:fixed;inset:20%;padding:25px;background:#17264c;border:2px solid white;border-radius:12px;text-align:center}#quiz[hidden]{display:none}</style><header><h1>Planet Clicker</h1><p id="name"></p><div id="score"></div><p>Click the planet or press space.</p></header><main><button id="planet" aria-label="Click planet"></button><aside><div id="rates"></div><button id="clickUp"></button><button id="autoUp"></button><button id="autoToggle" aria-pressed="false">Autoclicker: off · 10 clicks/second</button><p id="message"></p></aside></main><footer><button id="rebirth"></button><button id="save">Create save code</button><button id="load">Load save code</button><button id="sound">Sound: on</button><textarea id="code" aria-label="Save code" placeholder="Your save code"></textarea></footer><div id="quiz" hidden><h2>Space pop quiz</h2><p id="question"></p><div id="answers"></div></div><script>
const $=x=>document.getElementById(x);let s={points:0,power:1,auto:0,cl:0,al:0,r:0,growth:0},sound=true,rapid=false,ac;const planets=['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune','Black hole'],colors=['#aaa','#d6ac69','#268bbb','#b34e29','#dba776','#c7ad73','#80c6ce','#356bc0','#000'];const fmt=n=>n>=1e12?n.toExponential(2):Math.floor(n).toLocaleString();function draw(){$('score').textContent=fmt(s.points)+' points';$('name').textContent=planets[s.r];$('planet').style.background=colors[s.r];$('planet').style.width=$('planet').style.height=(230+(s.r===8?Math.min(300,s.growth):0))+'px';$('rates').textContent=fmt(s.power)+'/click · '+fmt(s.auto)+'/second';$('clickUp').textContent='Double clicks — '+fmt(20*2**s.cl);$('autoUp').textContent=(s.auto?'Double':'Start')+' clicks/second — '+fmt(20*2**s.al);$('rebirth').textContent=s.r<8?'Rebirth — '+fmt(1e15*4**s.r)+' points':'Black hole: keep growing';$('rebirth').disabled=s.r===8;}function boom(x,y){let p=document.createElement('span');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=colors[s.r];document.body.append(p);setTimeout(()=>p.remove(),500)}function noise(){if(!sound)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(110,ac.currentTime);o.frequency.exponentialRampToValueAtTime(25,ac.currentTime+.4);g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.4)}const qs=[['Which planet was discovered with a telescope in1781?',['Uranus','Mercury','Venus'],0],['What can escape from inside a black hole’s event horizon?',['Light','Nothing','Sound'],1],['What force holds planets in orbit around the Sun?',['Gravity','Magnetism','Friction'],0]];function quiz(){let q=qs[Math.floor(Math.random()*qs.length)];$('quiz').hidden=false;$('question').textContent=q[0];$('answers').replaceChildren();q[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(i===q[2]){s.power*=2;$('message').textContent='Correct! Click value doubled.'}else $('message').textContent='Not quite. Correct answer: '+q[1][q[2]];$('quiz').hidden=true;draw()};$('answers').append(b)})}function click(e){if(!$('quiz').hidden)return;s.points+=s.power;if(s.r===8)s.growth+=.5;let r=$('planet').getBoundingClientRect();boom(e?.clientX||r.x+r.width/2,e?.clientY||r.y+r.height/2);draw();if(Math.random()<.001)quiz()}$('planet').onclick=click;$('autoToggle').onclick=()=>{rapid=!rapid;$('autoToggle').textContent='Autoclicker: '+(rapid?'on':'off')+' · 10 clicks/second';$('autoToggle').setAttribute('aria-pressed',String(rapid))};setInterval(()=>{if(rapid)click()},100);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['TEXTAREA','BUTTON'].includes(e.target.tagName)){e.preventDefault();click()}});$('clickUp').onclick=()=>{let c=20*2**s.cl;if(s.points<c){$('message').textContent='Not enough points.';return}s.points-=c;s.cl++;s.power*=2;draw()};$('autoUp').onclick=()=>{let c=20*2**s.al;if(s.points<c){$('message').textContent='Not enough points.';return}s.points-=c;s.al++;s.auto=s.auto?s.auto*2:1;draw()};$('rebirth').onclick=()=>{if(s.r>=8)return;let c=1e15*4**s.r;if(s.points<c){$('message').textContent='Keep clicking to reach rebirth.';return}s.r++;s.points=0;s.cl=0;s.al=0;s.power=2**s.r;s.auto=0;noise();draw()};$('save').onclick=()=>{$('code').value=btoa(JSON.stringify(s));$('message').textContent='Copy your code to keep it.'};$('load').onclick=()=>{try{let n=JSON.parse(atob($('code').value.trim()));if(!['points','power','auto','cl','al','r','growth'].every(k=>Number.isFinite(n[k])&&n[k]>=0)||!Number.isInteger(n.r)||n.r>8)throw Error();s=n;draw();$('message').textContent='Save loaded.'}catch(e){$('message').textContent='Invalid save code.'}};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Sound: '+(sound?'on':'off')};setInterval(()=>{s.points+=s.auto;draw()},1000);draw();
</script></html>
