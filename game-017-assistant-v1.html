<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Clicker</title><style>body{font:18px system-ui;background:#e4edf1;color:#22323e;padding:24px}main{max-width:900px;margin:auto}h1{text-align:center}.layout{display:grid;grid-template-columns:2fr 1fr;gap:22px}button{font:inherit;padding:14px;cursor:pointer;border:2px solid #7c94a2;border-radius:8px;background:white}button:disabled{opacity:.45;cursor:default}#car{width:100%;height:230px;background:#a6cae1;border:0;position:relative;overflow:hidden}#car:active{transform:scale(.98)}#body{position:absolute;left:20%;top:40%;width:60%;height:65px;border-radius:50px 70px 12px 12px;background:#db4942;box-shadow:inset 0 -15px #0002}#body:before{content:'◉ ◉';display:block;position:absolute;left:25%;top:-25px;background:#e8f7ff;border:6px solid #db4942;border-radius:30px 30px 0 0;width:50%;height:38px}.wheel{position:absolute;width:45px;height:45px;background:#222;border:5px solid #888;border-radius:50%;top:calc(40% + 45px);animation:spin var(--speed,2s) linear infinite}.left{left:24%}.right{right:24%}.wheel:after{content:'+';color:#aaa;font-size:36px;position:absolute;inset:0;line-height:36px}@keyframes spin{to{transform:rotate(360deg)}}aside{background:#ccd9df;padding:18px;display:grid;gap:12px}output{font-size:32px}p{text-align:center}@media(max-width:600px){.layout{grid-template-columns:1fr}}</style><main><h1>Car Clicker</h1><p><output id="score">0</output> / 200,000 clicks</p><div class="layout"><section><button id="car" aria-label="Click the car"><span id="body"></span><span class="wheel left"></span><span class="wheel right"></span></button><p>Click the car for +1. Upgrade its wrap, tires and pace.</p><p id="stats"></p></section><aside><button id="wrap">New wrap · 350</button><button id="tires">New tires · 100</button><button id="pace">Pace upgrade · 500</button><button id="wash">Wash car</button><button id="reset">Start again</button></aside></div><p id="message" role="status">One car. Keep upgrading.</p></main><script>
const $=id=>document.getElementById(id);let clicks=0,pace=1,wrap=0,tires=0;let colors=['#db4942','#408dd0','#7c4dc7','#49a15c','#e6a331'];function render(){$('score').textContent=clicks.toLocaleString();$('stats').textContent='Pace level '+pace+' · Tire upgrades '+tires;$('wrap').disabled=clicks<350;$('tires').disabled=clicks<100;$('pace').disabled=clicks<500;$('body').style.background=colors[wrap%colors.length];document.querySelectorAll('.wheel').forEach(e=>{e.style.setProperty('--speed',(2/pace)+'s');e.style.borderColor=tires?'#e0e0e0':'#888'})}$('car').onclick=()=>{clicks=Math.min(200000,clicks+1);$('message').textContent=clicks===200000?'Click limit reached. You can still buy upgrades.':'+1 click';render()};function buy(c,fn){if(clicks<c)return;clicks-=c;fn();render()}$('wrap').onclick=()=>buy(350,()=>{wrap++;$('message').textContent='New wrap applied.'});$('tires').onclick=()=>buy(100,()=>{tires++;$('message').textContent='New tires fitted.'});$('pace').onclick=()=>buy(500,()=>{pace++;$('message').textContent='The car moves faster.'});$('wash').onclick=()=>{$('car').style.filter='brightness(1.15)';$('message').textContent='Car washed.';setTimeout(()=>$('car').style.filter='',1000)};$('reset').onclick=()=>{clicks=0;pace=1;wrap=0;tires=0;$('message').textContent='Starting again.';render()};render();
</script></html>
