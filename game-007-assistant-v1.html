<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebirth Clicker</title><style>body{margin:0;font:20px system-ui;background:#c9dfef;color:#183047;min-height:100vh;text-align:center}header{padding:20px;background:#ffffffaa}h1{margin:0}main{min-height:45vh;display:grid;place-content:center}#score{font-size:70px;font-weight:bold}button,select,input{font:inherit;padding:10px;margin:6px;border:2px solid #183047;border-radius:8px;background:white}aside{padding:16px;background:#ffffffaa}#hint{font-size:16px}#arrow{color:#a52b00;font-size:30px}#bonusInfo{font-size:16px}#clickFeedback{min-height:1.5em;font-weight:bold;color:#735000}</style><header><h1>Rebirth Clicker</h1><p>Click anywhere or press space to earn points.</p><p id="bonusInfo">Each manual click has a 1% chance of a +10,000-point bonus. Automatic clicks do not receive bonuses.</p></header><main><div id="score">0</div><div id="rate"></div><p id="clickFeedback" role="status"></p></main><aside><button id="up">Upgrade points per click</button><button id="autoUp">Buy automatic clicker</button><button id="autoToggle" aria-pressed="true">Automatic clickers: on</button><span id="arrow" hidden>➜</span><button id="reb">Rebirth</button><p><label>Make your world: <input id="color" type="color" value="#c9dfef"></label><select id="pattern"><option value="plain">Plain</option><option value="dots">Dots</option><option value="stripes">Stripes</option></select></p><p id="hint"></p></aside><script>
let points=0,rebirths=0,clickLevel=0,autoCount=0,autoEnabled=true,lastTick=performance.now();
const $=id=>document.getElementById(id);
function clickValue(){return 1+3*rebirths+clickLevel}
function accrue(){const now=performance.now(),elapsed=Math.max(0,now-lastTick)/1000;lastTick=now;if(autoEnabled)points+=elapsed*autoCount*clickValue()}
function draw(){let cost=20*(clickLevel+1),goal=1000*(rebirths+1);$('score').textContent=Math.floor(points).toLocaleString();$('rate').textContent=clickValue()+' points per click · '+autoCount+' automatic clicker'+(autoCount===1?'':'s')+' · '+(autoEnabled?autoCount:0)+' automatic clicks/second';$('up').textContent='+1 point per manual click — '+cost+' points';$('autoUp').textContent='Buy automatic clicker — '+20*(autoCount+1)+' points';$('autoToggle').textContent='Automatic clickers: '+(autoEnabled?'on':'off');$('autoToggle').setAttribute('aria-pressed',String(autoEnabled));$('reb').textContent='Rebirth — '+goal+' points';$('arrow').hidden=points<goal;$('hint').textContent=points>=goal?'You can rebirth now. It resets points and upgrades; each click gains 3 more points.':'Click anywhere or press space, then upgrade clicks or buy automatic clickers. Automatic clickers keep earning while this game is open in another tab.'}
function click(){accrue();const bonus=Math.random()<.01?10000:0;points+=clickValue()+bonus;$('clickFeedback').textContent=bonus?'Lucky click! +10,000 bonus points!':'+'+clickValue()+' points';draw()}
document.addEventListener('click',e=>{if(e.target.closest('button,input,select'))return;click()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();if(!e.repeat)click()}});
$('up').onclick=()=>{accrue();let cost=20*(clickLevel+1);if(points>=cost){points-=cost;clickLevel++}draw()};
$('autoUp').onclick=()=>{accrue();let cost=20*(autoCount+1);if(points>=cost){points-=cost;autoCount++}draw()};
$('autoToggle').onclick=()=>{accrue();autoEnabled=!autoEnabled;draw()};
$('reb').onclick=()=>{accrue();if(points>=1000*(rebirths+1)){points=0;clickLevel=0;autoCount=0;rebirths++;$('clickFeedback').textContent=''}draw()};
function bg(){document.body.style.backgroundColor=$('color').value;document.body.style.backgroundImage=$('pattern').value==='dots'?'radial-gradient(#ffffff88 3px,transparent 3px)':$('pattern').value==='stripes'?'repeating-linear-gradient(45deg,transparent 0 30px,#ffffff55 30px 60px)':'none';document.body.style.backgroundSize=$('pattern').value==='dots'?'25px 25px':'auto'}
$('color').oninput=bg;$('pattern').onchange=bg;
setInterval(()=>{accrue();draw()},250);document.addEventListener('visibilitychange',()=>{accrue();draw()});draw();
</script></html>
