<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebirth Clicker</title><style>body{margin:0;font:20px system-ui;background:#c9dfef;color:#183047;min-height:100vh;text-align:center}header{padding:20px;background:#ffffffaa}h1{margin:0}main{min-height:45vh;display:grid;place-content:center}#score{font-size:70px;font-weight:bold}button,select,input{font:inherit;padding:10px;margin:6px;border:2px solid #183047;border-radius:8px;background:white}aside{padding:16px;background:#ffffffaa}#hint{font-size:16px}#arrow{color:#a52b00;font-size:30px}</style><header><h1>Rebirth Clicker</h1><p>Click anywhere to earn points.</p></header><main><div id="score">0</div><div id="rate"></div></main><aside><button id="up">Upgrade clicking speed</button><span id="arrow" hidden>➜</span><button id="reb">Rebirth</button><p><label>Make your world: <input id="color" type="color" value="#c9dfef"></label><select id="pattern"><option value="plain">Plain</option><option value="dots">Dots</option><option value="stripes">Stripes</option></select></p><p id="hint"></p></aside><script>
let points=0,rebirths=0,speed=0;const $=id=>document.getElementById(id);function draw(){let cost=20*(speed+1),goal=1000*(rebirths+1);$('score').textContent=Math.floor(points).toLocaleString();$('rate').textContent=(1+3*rebirths)+' points per click · '+speed+' automatic clicks/second';$('up').textContent='Upgrade clicking speed — '+cost+' points';$('reb').textContent='Rebirth — '+goal+' points';$('arrow').hidden=points<goal;$('hint').textContent=points>=goal?'You can rebirth now. It resets points and upgrades; each click gains 3 more points.':'Click anywhere, then buy a speed upgrade or save up for rebirth.';}document.addEventListener('click',e=>{if(e.target.closest('button,input,select'))return;points+=1+3*rebirths;draw()});$('up').onclick=()=>{let cost=20*(speed+1);if(points>=cost){points-=cost;speed++;draw()}};$('reb').onclick=()=>{if(points>=1000*(rebirths+1)){points=0;speed=0;rebirths++;draw()}};function bg(){document.body.style.backgroundColor=$('color').value;document.body.style.backgroundImage=$('pattern').value==='dots'?'radial-gradient(#ffffff88 3px,transparent 3px)':$('pattern').value==='stripes'?'repeating-linear-gradient(45deg,transparent 0 30px,#ffffff55 30px 60px)':'none';document.body.style.backgroundSize=$('pattern').value==='dots'?'25px 25px':'auto'}$('color').oninput=bg;$('pattern').onchange=bg;setInterval(()=>{points+=speed*(1+3*rebirths);draw()},1000);draw();
</script></html>
