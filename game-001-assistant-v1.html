const $=id=>document.getElementById(id);let clicks=0,money=0,power=1,auto=0,next=50,on=false,ac,musicStep=0,active=false,mode=0,start=0,raf,last=0,ctx,canvas,state,keys={},picked=-1,matched=0,lock=false;const names=['Punching glove','Baseball bat','Automatic ball hitter','Drop kick','Basketball launching machine','Catapult','Slingshot','Cannon'];let bought=Array(8).fill(false);function volume(){return Number($('volume').value)/100}function tone(){if(!on||volume()<=0)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const t=ac.currentTime,pitch=170+Math.random()*170;for(let k=1;k<=3;k++){const o=ac.createOscillator(),g=ac.createGain();o.type=k===1?'sawtooth':'triangle';o.frequency.setValueAtTime(pitch*k,t);o.frequency.exponentialRampToValueAtTime(pitch*k*1.9,t+.09);o.frequency.exponentialRampToValueAtTime(pitch*k*.65,t+.32);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.085*volume()/k,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.36);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.37)}}function render(){$('score').textContent=clicks+' clicks · '+money+' upgrade points · '+power+'/hit';$('shop').replaceChildren();names.forEach((n,i)=>{let b=document.createElement('button'),cost=50*(i+1);b.textContent=bought[i]?n+' — owned':n+' — '+cost;b.disabled=bought[i]||money<cost;b.onclick=()=>{if(money<cost||bought[i])return;money-=cost;bought[i]=true;if(i===2)auto+=3;else power+=i+1;render()};$('shop').append(b)})}function hit(){if(active)return;clicks++;money+=power;$('ball').dataset.yelling='true';tone(500+Math.random()*800,.16);setTimeout(()=>$('ball').dataset.yelling='false',220);render();if(clicks>=next){next+=50;begin()}}$('ball').onclick=hit;$('sound').onclick=()=>{on=!on;if(on){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();musicStep=0}$('sound').textContent='Sound: '+(on?'on':'off')};setInterval(()=>{if(!active&&auto){money+=auto;render()}},350);

setInterval(()=>{if(!on||!ac)return;const beat=musicStep%64,root=[48,45,41,43][Math.floor(beat/16)];musicNote(melody[beat],.16,.08,beat<32?'square':'triangle');musicNote(root+(beat%2?12:0),.16,.09,'sine');if(beat%4===0){drum('kick');musicNote(root+19,.5,.035);musicNote(root+24,.5,.03)}if(beat%4===2)drum('snare');if(beat%2===1)drum('hat');if(beat%16>=12)musicNote(melody[beat]+12,.1,.035,'triangle');musicStep++},187.5);function finish(won){if(!active)return;active=false;cancelAnimationFrame(raf);$('popup').hidden=true;$('message').textContent=won?'Minigame complete. Back to the ball!':'Time or lives ran out. Back to the ball.';keys={}}function button(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('controls').append(b)}function begin(){active=true;mode=Math.floor(Math.random()*6);start=performance.now();last=start;$('popup').hidden=false;$('status').textContent='';$('area').replaceChildren();$('controls').replaceChildren();$('gameTitle').textContent=['Dinosaur jump','Maze munch','Flap through','Bird launch','Memory match','Connect the wires'][mode];$('directions').textContent=['Jump over 8 obstacles. Space or Jump.','Collect all dots. Arrow keys or buttons.','Pass 6 gaps. Space or Flap.','Launch the bird at 3 targets. Choose an angle, then Launch.','Find all matching pairs.','Choose a left wire and its matching right socket.'][mode];if(mode===4){memory();tick();return}if(mode===5){wires();tick();return}canvas=document.createElement('canvas');canvas.width=500;canvas.height=270;$('area').append(canvas);ctx=canvas.getContext('2d');if(mode===0){state={y:210,v:0,x:500,passed:0};button('Jump',jump)}if(mode===1){state={x:1,y:1,dots:[]};for(let y=1;y<8;y++)for(let x=1;x<14;x++)if(!wall(x,y))state.dots.push(x+','+y);['Left','Up','Down','Right'].forEach((n,i)=>button(n,()=>moveMaze([[-1,0],[0,-1],[0,1],[1,0]][i])))}if(mode===2){state={y:120,v:0,x:500,gap:100,passed:0};button('Flap',jump);canvas.onclick=jump}if(mode===3){state={x:35,y:225,vx:0,vy:0,flying:false,targets:[320,390,460],angle:45};let a=document.createElement('input');a.type='range';a.min=15;a.max=75;a.value=45;a.oninput=()=>state.angle=+a.value;$('controls').append(a);button('Launch',()=>{if(state.flying)return;let rad=state.angle*Math.PI/180;state.x=35;state.y=225;state.vx=Math.cos(rad)*340;state.vy=-Math.sin(rad)*340;state.flying=true})}tick()}function jump(){if(!active)return;if(mode===0&&state.y>=210)state.v=-390;if(mode===2)state.v=-160}function wall(x,y){return x<=0||x>=14||y<=0||y>=8||(x===5&&y<6)||(x===9&&y>2)}function moveMaze(d){if(!active||mode!==1)return;let x=state.x+d[0],y=state.y+d[1];if(!wall(x,y)){state.x=x;state.y=y;state.dots=state.dots.filter(p=>p!==x+','+y);if(!state.dots.length)finish(true)}}document.addEventListener('keydown',e=>{if(!active)return;if(e.code==='Space'){e.preventDefault();jump()}let d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();moveMaze(d)}});function memory(){let vals=[1,1,2,2,3,3,4,4].sort(()=>Math.random()-.5),grid=document.createElement('div');grid.className='cells';$('area').append(grid);picked=-1;matched=0;lock=false;vals.forEach((v,i)=>{let b=document.createElement('button');b.textContent='?';b.onclick=()=>{if(lock||b.disabled||picked===i)return;b.textContent=v;if(picked<0){picked=i;return}let p=picked;picked=-1;if(vals[p]===v){b.disabled=true;grid.children[p].disabled=true;matched+=2;if(matched===8)finish(true)}else{lock=true;setTimeout(()=>{if(!active)return;b.textContent='?';grid.children[p].textContent='?';lock=false},600)}};grid.append(b)})}function wires(){let row=document.createElement('div');row.className='row';$('area').append(row);let a=document.createElement('div'),b=document.createElement('div');row.append(a,b);let pick='',done=new Set();['Red','Blue','Green','Yellow'].forEach(v=>{let q=document.createElement('button');q.style.display='block';q.textContent=v;decorateWire(q,v,false);q.onclick=()=>{pick=v;$('status').textContent='Con
