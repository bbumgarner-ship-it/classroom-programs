<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clicker de la Fingero Verity</title><style>body{font:18px Arial;text-align:center;margin:0;background:linear-gradient(120deg,#ffcd85,#ffb9df,#b4d4ff,#b5edba);color:#222;min-height:100vh}body:before{content:'☺ ☺ ☺ ☺ ☺ ☺ ☺';font-size:90px;color:#ffdb22;position:fixed;inset:30% 0;z-index:-1;opacity:.5}header{background:#fff9;padding:15px}button{font:inherit;padding:12px;margin:6px;cursor:pointer;border:2px solid #a67f00;border-radius:8px;background:#ffe976}#face{width:190px;height:190px;border-radius:50%;font-size:100px;background:#ffdd24;margin:20px;display:inline-flex;align-items:center;justify-content:center}#face:active{transform:scale(.92)}#shop{background:#fff9;padding:15px;margin:15px;border-radius:10px}#boom{pointer-events:none;position:fixed;inset:0;display:grid;place-content:center;font-size:130px;opacity:0;background:#c99d7288;z-index:5}textarea{width:min(90%,650px);height:70px}#msg{min-height:25px}.invert{filter:invert(1)}[hidden]{display:none!important}.rainbow{animation:rainbow .4s linear 8}@keyframes rainbow{to{filter:hue-rotate(360deg)}}small{display:block;font-size:14px}</style><header><h1>Clicker de la Fingero Verity 🥶🤣</h1><p>Welcome to Verity's land. Click the face or press Space.</p><h2>☹ <span id="score">0</span> falsity points · 💎 <span id="diamonds">0</span></h2><p>Total clicks: <span id="total">0</span> · Rebirths: <span id="births">0</span></p></header><button id="face" aria-label="Click Verity">☺</button><p id="voice">☝ Click Verity!</p><button id="shopbutton">Item shop</button><button id="rebirth">Rebirth — 1,000 points</button><button id="invert" hidden>Toggle inverted Verity</button><button id="restart">Restart</button><label><input id="sound" type="checkbox"> Sound</label><div id="shop" hidden><h2>Item shop</h2><p>First visit bonus: 300 points.</p><button id="auto">Auto clicker — 100 points</button><button id="triple">3× clicker — 300 points</button><button id="exchange">10 loveity diamonds — 100 points</button><button id="tone">New color tone — 10 diamonds</button><button id="outfit">Hat outfit — 20 diamonds</button><p><span id="autos">0</span> auto clickers · <span id="power">1</span> points/click</p></div><p id="msg"></p><section><button id="save">Save code</button><button id="load">Load code</button><button id="download">Download save</button><br><textarea id="code" aria-label="Save code" placeholder="Your save code appears here. Keep it to load later."></textarea></section><div id="boom">💥</div><script>const $=x=>document.getElementById(x);let s={points:0,total:0,diamonds:0,auto:0,triple:false,births:0,shop:false,tone:0,hat:false,invert:false},recent=[],last=Date.now(),ctx;function power(){return(s.triple?3:1)*(1+s.births)}function draw(){$('score').textContent=s.points;$('total').textContent=s.total;$('diamonds').textContent=s.diamonds;$('births').textContent=s.births;$('autos').textContent=s.auto;$('power').textContent=power();$('face').textContent=s.hat?'🤠':'☺';$('face').style.background=['#ffdd24','#ff9ad9','#82e7ef','#9cec83'][s.tone];$('invert').hidden=!s.invert;$('triple').disabled=s.triple}function effect(){ $('boom').animate([{opacity:0},{opacity:1},{opacity:0}],900)}function gain(n){let old=s.total;s.total+=n;s.points+=n;if((old<1000&&s.total>=1000)||(old<1000000&&s.total>=1000000))effect();if(old<3000&&s.total>=3000){document.body.classList.add('rainbow');setTimeout(()=>document.body.classList.remove('rainbow'),3300)}draw()}function speak(){if(!$('sound').checked)return;try{const voice=speechSynthesis.getVoices().find(v=>v.localService&&v.lang.startsWith('en'));if(voice){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Verity');u.voice=voice;u.volume=.6;speechSynthesis.speak(u)}else{ctx??=new AudioContext();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);g.gain.value=.03;o.frequency.value=550;o.start();o.stop(ctx.currentTime+.08)}}catch{}}function tap(){last=Date.now();recent=recent.filter(t=>last-t<2000);recent.push(last);if(recent.length>=12)s.invert=true;gain(power());$('voice').textContent='Verity!';speak()}function buy(cost,fn){if(s.points<cost){$('msg').textContent='Uh oh! Not enough points.';return}s.points-=cost;fn();draw()}$('face').onclick=tap;$('shopbutton').onclick=()=>{if(!s.shop){s.shop=true;gain(300)}$('shop').hidden=!$('shop').hidden};$('auto').onclick=()=>buy(100,()=>s.auto++);$('triple').onclick=()=>{if(!s.triple)buy(300,()=>s.triple=true)};$('exchange').onclick=()=>buy(100,()=>s.diamonds+=10);$('tone').onclick=()=>{if(s.diamonds>=10){s.diamonds-=10;s.tone=(s.tone+1)%4;draw()}else $('msg').textContent='Uh oh! You need 10 diamonds.'};$('outfit').onclick=()=>{if(s.diamonds>=20&&!s.hat){s.diamonds-=20;s.hat=true;draw()}};$('invert').onclick=()=>$('face').classList.toggle('invert');$('rebirth').onclick=()=>{if(s.points<1000){$('msg').textContent='Uh oh! You need 1,000 points.';return}let b=s.births+1;s={points:0,total:0,diamonds:0,auto:0,triple:false,births:b,shop:false,tone:0,hat:false,invert:false};$('voice').textContent='☝ Click Verity!';draw()};$('restart').onclick=()=>{if(confirm('Restart everything?'))location.reload()};function save(){let code=btoa(JSON.stringify(s));$('code').value=code;return code}$('save').onclick=save;$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([save()],{type:'text/plain'}));a.download='clicker-save.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('load').onclick=()=>{try{let v=JSON.parse(atob($('code').value.trim()));for(let k of ['points','total','diamonds','auto','births','tone'])if(!Number.isFinite(v[k])||v[k]<0||v[k]>1e15)throw 0;if(v.tone>3)throw 0;s={points:Math.floor(v.points),total:Math.floor(v.total),diamonds:Math.floor(v.diamonds),auto:Math.floor(v.auto),births:Math.floor(v.births),tone:Math.floor(v.tone),triple:!!v.triple,shop:!!v.shop,hat:!!v.hat,invert:!!v.invert};draw();$('msg').textContent='Save loaded.'}catch{$('msg').textContent='Uh oh! Invalid save code.'}};setInterval(()=>{if(s.auto)gain(s.auto*power());if(Date.now()-last>30000)$('voice').textContent='Come back or else Verity will haunt you'},1000);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target===document.body){e.preventDefault();tap()}});draw();</script></html>
