<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Clicker</title><style>body{font:18px system-ui;background:#23352c;color:#eef3df;margin:0;padding:24px;text-align:center}main{max-width:800px;margin:auto}button{font:inherit;background:#c5d8a5;color:#18241d;border:0;border-radius:10px;padding:15px;margin:6px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#zombie{font-size:110px;background:none;transition:transform .1s}#zombie:active{transform:scale(.9)}section{background:#314a3b;padding:16px;border-radius:15px}#visitor{position:fixed;top:140px;left:-100px;font-size:48px;animation:cross 9s linear;z-index:5}@keyframes cross{to{left:110%}}small{display:block;color:#c2d1ba}output{font-size:32px}</style><main><h1>Zombie Clicker</h1><p>Click the zombie. Catch the wandering zombie to double your zombies.</p><output id="score"></output><small id="stats"></small><button id="zombie" aria-label="Click zombie">🧟</button><p id="mood">Just chilling.</p><section><h2>Shop</h2><button id="power">+1 zombie per click · 50</button><button id="auto">+1 automatic click/second · 1,000</button><button id="power10">Upgraded clicker · 500 · +10/click</button><button id="superAuto">Super automatic zombie · 10,000 · +1,000/second</button><button id="superPower">Super zombie clicker · 100,000 · +1,000/click</button><p id="prestigeText"></p><button id="prestige">Prestige</button></section><p id="message" role="status"></p><label><input id="sound" type="checkbox" checked> Quiet click sound</label><small>Progress saves on this device when storage is available.</small></main><script>
const $=id=>document.getElementById(id);let s={z:0,p:1,a:0,m:1,bought:0},last=Date.now(),ctx;try{Object.assign(s,JSON.parse(localStorage.getItem('zombie-clicker-save')||'{}'))}catch{}function save(){try{localStorage.setItem('zombie-clicker-save',JSON.stringify(s))}catch{}}function draw(){$('score').textContent=Math.floor(s.z).toLocaleString()+' zombies';$('stats').textContent=+(s.p*s.m).toFixed(2)+' per click · '+s.a+' per second · ×'+s.m+' manual-only multiplier';$('power').disabled=s.z<50;$('auto').disabled=s.z<1000;$('power10').disabled=s.z<500;$('superAuto').disabled=s.z<10000;$('superPower').disabled=s.z<100000;$('prestige').disabled=s.bought===0;$('prestigeText').textContent='Prestige resets zombies and shop upgrades, adding '+(s.bought/10).toFixed(1)+' to your manual-click multiplier (0.1 per purchase; automatic earnings are never multiplied).';}function tick(){if(!$('sound').checked)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=190;g.gain.setValueAtTime(.025,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.05);o.start();o.stop(ctx.currentTime+.06)}catch{}}$('zombie').onclick=()=>{s.z+=s.p*s.m;last=Date.now();$('mood').textContent='Just chilling.';tick();draw();save()};function buy(cost,key,amount=1){if(s.z<cost)return;s.z-=cost;s[key]+=amount;s.bought++;draw();save()}$('power').onclick=()=>buy(50,'p');$('auto').onclick=()=>buy(1000,'a');$('power10').onclick=()=>buy(500,'p',10);$('superAuto').onclick=()=>buy(10000,'a',1000);$('superPower').onclick=()=>buy(100000,'p',1000);$('prestige').onclick=()=>{if(!s.bought)return;let next=Math.round((s.m+s.bought/10)*10)/10;s={z:0,p:1,a:0,m:next,bought:0};$('message').textContent='A fresh start. Your multiplier is now ×'+next;draw();save()};setInterval(()=>{s.z+=s.a;if(Date.now()-last>15000)$('mood').textContent='The zombie is getting bored…';draw();save()},1000);setInterval(()=>{if(document.getElementById('visitor'))return;let b=document.createElement('button');b.id='visitor';b.textContent='🧟';b.setAttribute('aria-label','Double zombies');b.onclick=()=>{s.z*=2;tick();draw();save();b.remove()};b.onanimationend=()=>b.remove();document.body.append(b)},25000);draw();
</script></html>
