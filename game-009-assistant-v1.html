<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verity Clicker</title><style>body{margin:0;background:#20273b;color:white;font:18px Arial;text-align:center}h1{margin:25px}main{display:flex;justify-content:center;gap:45px;padding:20px;flex-wrap:wrap}button{cursor:pointer;background:#d3dbf3;border:0;border-radius:10px;padding:14px;font:inherit;margin:7px}#verity{display:block;background:#ffe35b;color:#251b00;width:210px;height:210px;border-radius:50%;font-size:80px;margin:30px auto;transition:transform .1s}#verity:active{transform:scale(.85)}aside{background:#303b58;padding:20px;border-radius:14px;max-width:330px}aside button{display:block;width:100%}#gold{position:fixed;top:25%;left:0;width:132px;padding:6px;background:#fff2ae;border:3px solid #e2a413;color:#513200;font-size:13px;z-index:3;animation:fly 8s linear forwards;box-shadow:0 4px 15px #0006}#gold svg{display:block;width:100%;height:82px}#gold:hover{box-shadow:0 0 18px #ffda3b}#variant{background:#c9a1ef}#status{min-height:35px}#suit{font-size:32px}small{display:block;font-size:14px;opacity:.8}@keyframes fly{0%{left:0;top:25%}50%{top:18%}100%{left:calc(100% - 150px);top:50%}}@media(prefers-reduced-motion:reduce){#gold{animation:none!important;left:calc(50% - 66px)}}[hidden]{display:none!important}</style><h1>Verity Clicker</h1><p>Use your cursor or space bar to tap the verity!</p><main><section><h2><span id="score">0</span> veritys</h2><p>Falsity coins: <span id="coins">0</span></p><button id="verity" aria-label="Tap Verity">☺</button><div id="suit"></div><button id="variant">Change colored variant</button><small>Colored variants earn 1 falsity coin per click.</small><p id="status"></p></section><aside><h2>Go to the shop</h2><button id="clickbuy">+1 Verity per click — 25 veritys</button><p id="clickpower"></p><button id="worker">Buy verity worker — 25</button><p><span id="workers">0</span> workers · +1 each / 3 seconds</p><button id="factory">Buy verity factory — 200</button><p><span id="factories">0</span> factories · +10 each / 3 seconds</p><button id="suitbuy">Buy verity suit — 50 falsity coins</button><p>A suit doubles manual clicks.</p><label><input id="sound" type="checkbox" checked> Tapping sound</label></aside></main><button id="gold" hidden aria-label="Catch Golden Lord Verity for 100 veritys"><svg viewBox="0 0 140 100" aria-hidden="true"><path d="M44 49Q14 25 2 43L21 53L5 58L30 66L17 74Q39 81 49 66M96 49Q126 25 138 43L119 53L135 58L110 66L123 74Q101 81 91 66" fill="#fffdf0" stroke="#d5a63b" stroke-width="3"/><circle cx="70" cy="57" r="32" fill="#ffd640" stroke="#c58b0c" stroke-width="3"/><path d="M46 30L40 8L59 20L70 3L81 20L100 8L94 30Z" fill="#f5b72c" stroke="#a56c08" stroke-width="3"/><path d="M50 28H90" stroke="#fff2a0" stroke-width="4"/><ellipse cx="59" cy="51" rx="3" ry="5" fill="#49320c"/><ellipse cx="81" cy="51" rx="3" ry="5" fill="#49320c"/><path d="M55 65Q70 80 85 65" fill="none" stroke="#49320c" stroke-width="3" stroke-linecap="round"/><circle cx="70" cy="21" r="4" fill="#df687d"/></svg>Golden Lord Verity<br>Catch: +100</button><script>const $=x=>document.getElementById(x);let v=0,f=0,w=0,fac=0,color=0,suit=false,clickBonus=0,ctx;
const saveKey='verity-clicker-save';
try{const saved=JSON.parse(localStorage.getItem(saveKey)||'{}');v=saved.v??0;f=saved.f??0;w=saved.w??0;fac=saved.fac??0;color=saved.color??0;suit=saved.suit??false;clickBonus=saved.clickBonus??0}catch{}
function save(){try{localStorage.setItem(saveKey,JSON.stringify({v,f,w,fac,color,suit,clickBonus}))}catch{}}
function clickValue(){return (1+clickBonus)*(suit?2:1)}
function show(){$('score').textContent=v;$('coins').textContent=f;$('workers').textContent=w;$('factories').textContent=fac;$('suit').textContent=suit?'🎩':'';$('suitbuy').disabled=suit;$('clickpower').textContent=clickValue()+' Verity per click · '+clickBonus+' permanent +1 upgrade'+(clickBonus===1?'':'s');$('verity').style.background=['#ffe35b','#a5e8ff','#efadff','#b8f69e'][color];save();}function tap(){v+=clickValue();if(color)f++;$('verity').animate([{transform:'scale(.85)'},{transform:'scale(1)'}],120);if($('sound').checked)try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=200;g.gain.value=.03;o.start();o.stop(ctx.currentTime+.04)}catch{}show()}$('verity').onclick=tap;$('clickbuy').onclick=()=>{if(v>=25){v-=25;clickBonus++;$('status').textContent='+1 Verity per click added permanently.'}else $('status').textContent='You need 25 veritys.';show()};$('worker').onclick=()=>{if(v>=25){v-=25;w++}else $('status').textContent='You need 25 veritys.';show()};$('factory').onclick=()=>{if(v>=200){v-=200;fac++}else $('status').textContent='You need 200 veritys.';show()};$('variant').onclick=()=>{color=(color+1)%4;$('verity').style.background=['#ffe35b','#a5e8ff','#efadff','#b8f69e'][color];show()};$('suitbuy').onclick=()=>{if(f>=50&&!suit){f-=50;suit=true}else $('status').textContent='You need 50 falsity coins.';show()};setInterval(()=>{v+=w+fac*10;show()},3000);setInterval(()=>{let g=$('gold');g.hidden=false;g.style.animation='none';void g.offsetWidth;g.style.animation='fly 8s linear forwards';setTimeout(()=>g.hidden=true,8000)},20000);$('gold').onclick=()=>{if($('gold').hidden)return;v+=100;$('gold').hidden=true;$('status').textContent='Golden boost: +100 veritys!';show()};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target===document.body){e.preventDefault();tap()}});show();</script></html>
