<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verity Clicker</title><style>body{margin:0;background:#20273b;color:white;font:18px Arial;text-align:center}h1{margin:25px}main{display:flex;justify-content:center;gap:45px;padding:20px;flex-wrap:wrap}button{cursor:pointer;background:#d3dbf3;border:0;border-radius:10px;padding:14px;font:inherit;margin:7px}#verity{display:block;background:#ffe35b;color:#251b00;width:210px;height:210px;border-radius:50%;font-size:80px;margin:30px auto;transition:transform .1s}#verity:active{transform:scale(.85)}aside{background:#303b58;padding:20px;border-radius:14px;max-width:330px}aside button{display:block;width:100%}#gold{position:fixed;top:25%;left:0;background:gold;border:3px solid orange;font-size:24px;z-index:3;animation:fly 8s linear forwards}#variant{background:#c9a1ef}#status{min-height:35px}#suit{font-size:32px}small{display:block;font-size:14px;opacity:.8}@keyframes fly{to{left:90%;top:50%}}[hidden]{display:none!important}</style><h1>Verity Clicker</h1><p>Use your cursor or space bar to tap the verity!</p><main><section><h2><span id="score">0</span> veritys</h2><p>Falsity coins: <span id="coins">0</span></p><button id="verity" aria-label="Tap Verity">☺</button><div id="suit"></div><button id="variant">Change colored variant</button><small>Colored variants earn 1 falsity coin per click.</small><p id="status"></p></section><aside><h2>Go to the shop</h2><button id="worker">Buy verity worker — 25</button><p><span id="workers">0</span> workers · +1 each / 3 seconds</p><button id="factory">Buy verity factory — 200</button><p><span id="factories">0</span> factories · +10 each / 3 seconds</p><button id="suitbuy">Buy verity suit — 50 falsity coins</button><p>A suit doubles manual clicks.</p><label><input id="sound" type="checkbox" checked> Tapping sound</label></aside></main><button id="gold" hidden>★ Golden lord verity!</button><script>const $=x=>document.getElementById(x);let v=0,f=0,w=0,fac=0,color=0,suit=false,ctx;function show(){$('score').textContent=v;$('coins').textContent=f;$('workers').textContent=w;$('factories').textContent=fac;$('suit').textContent=suit?'🎩':'';$('suitbuy').disabled=suit;}function tap(){v+=suit?2:1;if(color)f++;$('verity').animate([{transform:'scale(.85)'},{transform:'scale(1)'}],120);if($('sound').checked)try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=200;g.gain.value=.03;o.start();o.stop(ctx.currentTime+.04)}catch{}show()}$('verity').onclick=tap;$('worker').onclick=()=>{if(v>=25){v-=25;w++}else $('status').textContent='You need 25 veritys.';show()};$('factory').onclick=()=>{if(v>=200){v-=200;fac++}else $('status').textContent='You need 200 veritys.';show()};$('variant').onclick=()=>{color=(color+1)%4;$('verity').style.background=['#ffe35b','#a5e8ff','#efadff','#b8f69e'][color];show()};$('suitbuy').onclick=()=>{if(f>=50&&!suit){f-=50;suit=true}else $('status').textContent='You need 50 falsity coins.';show()};setInterval(()=>{v+=w+fac*10;show()},3000);setInterval(()=>{let g=$('gold');g.hidden=false;g.style.animation='none';void g.offsetWidth;g.style.animation='fly 8s linear forwards';setTimeout(()=>g.hidden=true,8000)},20000);$('gold').onclick=()=>{v+=100;$('gold').hidden=true;$('status').textContent='Golden boost: +100 veritys!';show()};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target===document.body){e.preventDefault();tap()}});show();</script></html>
