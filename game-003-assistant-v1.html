<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chicken Clicks</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui;color:#203225;background:#e8f2df}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px}button,select{font:inherit;padding:12px;border:1px solid #8caa7c;border-radius:9px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.97)}.row{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:18px;background:#ffffffd9;border-radius:14px;margin:16px 0}.stats{font-weight:bold;font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:110px;min-width:210px;min-height:200px;background:#fff7cc}.message{min-height:28px}small{font-size:13px} [hidden]{display:none!important}#farm{text-align:center;background:linear-gradient(#c3e9ff 65%,#9fca72 65%)}</style><main><h1>Chicken Clicks</h1><p>Click the chicken, buy clothes and upgrades, and build a higher score.</p><small>Play only with your teacher’s permission. No hacking.</small><div class="panel stats" id="stats"></div><div class="panel" id="farm"><div id="hat" style="font-size:40px;height:52px"> </div><button class="big" id="chicken" aria-label="Click the chicken">🐔</button><div>🚜 🌾 🌻 🐓 🌾</div></div><div class="panel"><h2>Shop</h2><div class="grid" id="shop"></div></div><div class="panel"><button id="rebirth"></button><p>Rebirth resets clicks, upgrades and purchases. Each rebirth gives +1 per click and 50 extra starting clicks.</p></div><p class="message" id="msg" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id);let clicks=50,total=50,cpc=1,cps=0,rebirths=0,upgradeCost=50;const bought=new Set();
const items=[['Bow tie',100,'🎀'],['Cowboy hat',200,'🤠'],['Crown',500,'👑'],['Sunset farm',300,'sunset'],['Night farm',600,'night']];
function say(s){$('msg').textContent=s}function draw(){ $('stats').textContent=`Clicks: ${Math.floor(clicks)} • Total earned: ${Math.floor(total)} • Per click: ${cpc} • Per second: ${cps}`;$('rebirth').textContent=`Rebirth ${rebirths+1} — ${1000*(rebirths+1)} clicks`;$('shop').innerHTML='';const b=document.createElement('button');b.textContent=`+1 click / second — ${upgradeCost}`;b.onclick=()=>{if(clicks<upgradeCost)return say('Not enough clicks.');clicks-=upgradeCost;cps++;upgradeCost*=2;draw()};$('shop').append(b);items.forEach(([name,cost,value])=>{const b=document.createElement('button');b.textContent=bought.has(name)?`Wear/use ${name}`:`${name} — ${cost}`;b.onclick=()=>{if(!bought.has(name)){if(clicks<cost)return say('Not enough clicks.');clicks-=cost;bought.add(name)}if(value==='sunset')$('farm').style.background='linear-gradient(#ffbd74,#a5bb68)';else if(value==='night')$('farm').style.background='linear-gradient(#273c62,#70945e)';else $('hat').textContent=value;say(`${name} equipped.`);draw()};$('shop').append(b)})}
$('chicken').onclick=()=>{clicks+=cpc;total+=cpc;draw()};$('rebirth').onclick=()=>{const need=1000*(rebirths+1);if(clicks<need)return say(`You need ${need} clicks.`);rebirths++;clicks=50*(rebirths+1);total+=clicks;cpc=1+rebirths;cps=0;upgradeCost=50;bought.clear();$('hat').textContent='';$('farm').style.background='';say('Reborn! Your clicks are stronger.');draw()};setInterval(()=>{if(cps){clicks+=cps;total+=cps;draw()}},1000);draw();
</script></html>
