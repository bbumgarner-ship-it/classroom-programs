<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chicken Clicks</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui;color:#203225;background:#e8f2df}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px}button,select{font:inherit;padding:12px;border:1px solid #8caa7c;border-radius:9px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.97)}.row{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:18px;background:#ffffffd9;border-radius:14px;margin:16px 0}.stats{font-weight:bold;font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:110px;min-width:210px;min-height:200px;background:#fff7cc}.message{min-height:28px}small{font-size:13px} [hidden]{display:none!important}#farm{position:relative;text-align:center;background:#c3e9ff;overflow:hidden;min-height:330px;padding-top:55px}.farm-scenery{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.sky{fill:#c3e9ff}.field{fill:#8cbd60}#farm[data-theme="sunset"] .sky{fill:#f4ad77}#farm[data-theme="sunset"] .field{fill:#8c9d57}#farm[data-theme="night"] .sky{fill:#263654}#farm[data-theme="night"] .field{fill:#4d7249}#chicken{position:relative;width:min(330px,90%);height:260px;min-width:0;min-height:0;padding:0;border:0;background:transparent;filter:drop-shadow(0 7px 4px #304b3b40)}#chicken svg{width:100%;height:100%;display:block}#farm p{position:relative;margin:0;font-size:14px;background:#ffffffe0;border-radius:8px;display:inline-block;padding:6px 12px}#chicken:active{transform:translateY(4px) scale(.97)}</style><main><h1>Chicken Clicks</h1><p>Click the chicken, buy clothes and upgrades, and build a higher score.</p><small>Play only with your teacher’s permission. No hacking.</small><div class="panel stats" id="stats"></div><div class="panel" id="farm" data-theme="day">

<button class="big" id="chicken" aria-label="Click the chicken">
<svg viewBox="0 0 330 270" role="img" aria-label="A white hen wearing your equipped clothing"><defs><radialGradient id="feathers" cx="40%" cy="30%"><stop stop-color="#fffefa"/><stop offset=".7" stop-color="#e9dfc8"/><stop offset="1" stop-color="#b8a887"/></radialGradient><linearGradient id="wing" x2="1" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#b9a98c"/></linearGradient></defs><ellipse cx="168" cy="248" rx="98" ry="10" fill="#314d3530"/><g stroke="#c08b36" stroke-width="5" stroke-linecap="round" fill="none"><path d="m148 209-5 30-21 8m21-8 18 8m30-37 5 29-19 9m19-9 18 8"/></g><g fill="url(#wing)" stroke="#a9997d" stroke-width="1.2"><path d="M103 138Q49 121 41 62q40 10 72 62Q70 72 80 46q33 24 49 80Q116 77 133 65q18 28 14 68z"/><path d="M106 133C92 172 104 212 150 220c54 11 93-18 96-67l-4-53-41-8-22 40z" fill="url(#feathers)"/><path d="M195 141q-52-25-78 10c-12 19 12 47 51 48q36-10 37-32-13 15-30 19 23-22 20-45z"/><path d="m134 155 42 30m-48-17 33 21m-19-39 38 23m-26-28 29 16" fill="none" stroke="#b8ab90"/></g><path d="M196 137q5-24 1-41-6-34 14-47 24-13 45 3 25 22 2 48-18 19-19 50z" fill="url(#feathers)" stroke="#b7a78b" stroke-width="1.2"/><path d="M208 50q-12-16-3-23 7-5 12 9-1-24 10-24 10 1 8 23 7-20 16-14 9 7-1 25" fill="#c9372f" stroke="#9e2a26" stroke-width="1.5"/><path d="m257 70 27 10-27 8z" fill="#d5a34d" stroke="#a77530" stroke-width="1.5"/><path d="M249 90q17 19 5 31-14 4-13-27" fill="#c43b34"/><circle cx="247" cy="64" r="5.8" fill="#cf8a30"/><circle cx="248" cy="64" r="3.5" fill="#191a16"/><circle cx="249" cy="62.5" r="1.3" fill="#fff"/><g fill="none" stroke="#c6b99c" stroke-width="1.2"><path d="m205 102 7 12 4-14m4 14 5 13 6-16m-29 12 6 16 8-5m-53 64 7 8 9-8m1 6 9 8 8-12m-75-34 5 14 10-2"/></g>
<g id="wear-bow" hidden><path d="m207 117-21-10v27l21-8 21 8v-27z" fill="#ce4265" stroke="#782944" stroke-width="2"/><circle cx="207" cy="121" r="6" fill="#ef718d"/></g>
<g id="wear-cowboy" hidden><path d="M198 39q-7-9-21-1 6 22 52 21 41-1 43-19-15 1-22 4l-5-27-18 5-17-4z" fill="#986339" stroke="#553620" stroke-width="2"/><path d="m205 38 44 4" stroke="#4b3425" stroke-width="7"/></g>
<g id="wear-crown" hidden><path d="m201 43-7-32 20 13L226 3l11 22 22-13-7 33z" fill="#f4c544" stroke="#a97620" stroke-width="2"/><path d="m202 38 50 2" stroke="#ffe79c" stroke-width="4"/><circle cx="226" cy="30" r="4" fill="#d9484b"/></g></svg></button><br><p id="equipped">Farmyard · No accessories equipped</p></div><div class="panel"><h2>Shop</h2><div class="grid" id="shop"></div></div><div class="panel"><button id="rebirth"></button><p>Rebirth resets clicks, upgrades and purchases. Each rebirth gives +1 per click and 50 extra starting clicks.</p></div><p class="message" id="msg" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id);let clicks=50,total=50,cpc=1,cps=0,rebirths=0,upgradeCost=50,clickUpgradeCost=75;let headwear='',bow=false;const bought=new Set();
const items=[['Bow tie',100,'bow'],['Cowboy hat',200,'cowboy'],['Crown',500,'crown'],['Sunset farm',300,'sunset'],['Night farm',600,'night']];
function say(s){$('msg').textContent=s}function draw(){
$('wear-bow').toggleAttribute('hidden',!bow);$('wear-cowboy').toggleAttribute('hidden',headwear!=='cowboy');$('wear-crown').toggleAttribute('hidden',headwear!=='crown');$('equipped').textContent='Farmyard · '+([bow?'Bow tie':'',headwear==='cowboy'?'Cowboy hat':headwear==='crown'?'Crown':''].filter(Boolean).join(' + ')||'No accessories equipped'); $('stats').textContent=`Clicks: ${Math.floor(clicks)} • Total earned: ${Math.floor(total)} • Per click: ${cpc} • Per second: ${cps}`;$('rebirth').textContent=`Rebirth ${rebirths+1} — ${1000*(rebirths+1)} clicks`;$('shop').innerHTML='';const b=document.createElement('button');b.textContent=`+1 click / second — ${upgradeCost}`;b.onclick=()=>{if(clicks<upgradeCost)return say('Not enough clicks.');clicks-=upgradeCost;cps++;upgradeCost*=2;draw()};$('shop').append(b);const manual=document.createElement('button');manual.textContent=`+1 per click — ${clickUpgradeCost}`;manual.onclick=()=>{if(clicks<clickUpgradeCost)return say('Not enough clicks.');clicks-=clickUpgradeCost;cpc++;clickUpgradeCost=Math.ceil(clickUpgradeCost*1.8);say('Clicks per click increased.');draw()};$('shop').append(manual);items.forEach(([name,cost,value])=>{const b=document.createElement('button');b.textContent=bought.has(name)?`Wear/use ${name}`:`${name} — ${cost}`;b.onclick=()=>{if(!bought.has(name)){if(clicks<cost)return say('Not enough clicks.');clicks-=cost;bought.add(name)}if(value==='sunset'||value==='night')$('farm').dataset.theme=value;else if(value==='bow')bow=true;else headwear=value;say(`${name} equipped.`);draw()};$('shop').append(b)})}
$('chicken').onclick=()=>{clicks+=cpc;total+=cpc;draw()};$('rebirth').onclick=()=>{const need=1000*(rebirths+1);if(clicks<need)return say(`You need ${need} clicks.`);rebirths++;clicks=50*(rebirths+1);total+=clicks;cpc=1+rebirths;cps=0;upgradeCost=50;clickUpgradeCost=75;bought.clear();headwear='';bow=false;$('farm').dataset.theme='day';say('Reborn! Your clicks are stronger.');draw()};setInterval(()=>{if(cps){clicks+=cps;total+=cps;draw()}},1000);draw();
</script></html>
