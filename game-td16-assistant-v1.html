 12px}.card p{line-height:1.6}.card button{margin:5px 5px 0 0}.hidden{display:none!important}textarea{width:100%;height:120px;background:#07141c;color:white;border:1px solid #ffffff50;padding:10px;resize:vertical}label{display:block;margin:12px 0}select{background:#20323c;color:white;padding:7px;max-width:100%}#mini{width:100%;height:125px;border-radius:7px;margin-top:12px}.loading{height:5px;background:#ffffff20;margin:16px 0}.loading i{display:block;background:var(--accent);height:100%;animation:load 1s linear forwards}@keyframes load{from{width:0}to{width:100%}}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}header{padding:15px}.badge{display:none}}@media(max-width:480px){.sidebar{display:block}.panel{margin-bottom:10px}.card{padding:20px}button{padding:10px}.stats{gap:8px;font-size:13px}}
</style><body style="--accent:#68d9ef"><header><div><h1>Car Tower Defense</h1><p>From rusty washer to luxury detail shop.</p></div><span class="badge">TOWER DEFENSE</span></header><main class="layout"><section class="board"><div id="stats" class="stats" aria-live="polite"></div><canvas id="game" width="900" height="540" aria-label="Game board. Select a defender, then click a placement location." tabindex="0"></canvas><div class="toolbar"><button id="wave">Start wave</button><button id="pause">Pause</button><button id="speed">Speed ×1</button><button id="retry">Retry level</button><button id="save">Save code</button><button id="load">Load code</button><button id="settings">Settings</button><button id="help">How to play</button></div><div id="notice" role="status"></div></section><aside class="sidebar"><section class="panel"><h2 id="shopTitle">Defender shop</h2><div id="shop"></div><div id="selection" class="info">Select a defender, then choose a place on the map.</div><button id="upgrade" class="hidden">Upgrade</button><button id="baseUpgrade" class="hidden">Upgrade tower · 80</button><canvas id="mini" width="250" height="125" class="hidden" aria-label="Close-up of the selected phighter"></canvas></section><section class="panel" style="margin-top:12px"><h2 id="detailTitle">Field notes</h2><div id="details" class="info"></div><div id="custom" class="hidden"><label>Paint <select id="paint"><option value="#4fa9e2">Ocean blue</option><option value="#c44b48">Racing red</option><option value="#e9c66b">Gold</option><option value="#ece9df">Pearl white</option><option value="#3c3f49">Graphite</option></select></label><label>Rims <select id="rims"><option>Classic</option><option>Sport</option><option>Luxury</option></select></label><label>Exhaust <select id="exhaust"><option>Stock</option><option>Twin</option><option>Sport</option></select></label></div></section></aside></main><div id="overlay" class="overlay"><div class="card" id="dialog"></div></div>
<script>
'use strict';
const C={"title": "Car Tower Defense", "subtitle": "From rusty washer to luxury detail shop.", "mode": "cars", "bg": "#183c47", "accent": "#68d9ef", "currency": "Dollars", "money": 500, "health": 1, "kill": 0, "path": [[-30, 160], [150, 160], [150, 70], [500, 70], [560, 150], [560, 290], [400, 290], [400, 220], [260, 220], [260, 370], [100, 370], [100, 460], [720, 460], [810, 370], [920, 370]], "towers": [["Rusty washer", 100, 8, 160, 0.5], ["Good washer", 250, 18, 180, 0.45], ["Big tank washer", 450, 32, 210, 0.4]], "help": "Press Space or Send cars to send a group of dirty cars. Place pressure washers beside the road. Fully clean cars reach the garage and pay you; dirty cars crash and go to the junkyard with a $50 penalty. Start with $500 and one rusty washer. Never let your balance reach $0. Click washers to upgrade. Customize car paint, rims and exhaust at no cost."},mode=C.mode,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=900,H=540;
const laneMode=['chimps','coderot'].includes(mode), grid={x:120,y:60,w:650,h:430,cols:8,rows:5};
let state, selectedType=0, selectedId=null, hover=null, dragging=false, pending=null, speed=1, sound=false,audio=null,frameTime=0,lastMusic=0,modal=true,previousPause=false,selectionCursor={col:0,row:0},hiddenClicks=0;
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const path=C.path,segments=[];let pathLength=0;
for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segments.push({a,b,l,start:pathLength});pathLength+=l;}
function pointAt(d){for(const s of segments)if(d<=s.start+s.l){let t=clamp((d-s.start)/s.l,0,1);return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,angle:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};}let p=path.at(-1)||[0,0];return{x:p[0],y:p[1],angle:0};}
function pathDistance(x,y){let best=1e9;for(const s of segments){let dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],t=clamp(((x-s.a[0])*dx+(y-s.a[1])*dy)/(s.l*s.l),0,1);best=Math.min(best,Math.hypot(x-s.a[0]-t*dx,y-s.a[1]-t*dy));}return best;}
function fresh(){state={money:C.money,hp:C.health,maxHp:C.health,towers:[],enemies:[],effects:[],wave:0,level:1,subwave:0,score:0,time:0,levelTime:0,running:false,paused:false,over:false,won:false,queue:[],spawnTimer:0,breakTime:0,uid:0,freeUsed:false,checkpoint:null,cleaned:0,junked:0,carCount:0,rain:false,baseLevel:1,story:1};selectedId=null;selectedType=0;speed=1;$('speed').textContent='Speed ×1';$('pause').textContent='Pause';if(mode==='cars'){addTower(0,220,120,false);state.freeUsed=true;}checkpoint();updateUI();}
function snapshot(){return JSON.parse(JSON.stringify(state,(k,v)=>['effects','checkpoint'].includes(k)?undefined:v));}
function checkpoint(){state.checkpoint=snapshot();}
function notice(t){$('notice').textContent=t;}
function tone(freq=440,duration=.1,type='sine',vol=.045){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){sound=false;}}
function showDialog(html){previousPause=state?.paused||false;modal=true;$('overlay').classList.remove('hidden');$('dialog').innerHTML=html;}
function closeDialog(){modal=false;$('overlay').classList.add('hidden');}
function titleScreen(){showDialog(`<h2>${C.title}</h2><p>${C.subtitle}</p><p>${mode==='coderot'?'Coderot is approaching the tower. The phighter gears are your last line of defense.':C.help}</p><button id="play">${mode==='coderot'?'Start story':'Play'}</button><button id="titleSettings">Settings</button><button id="credits">Credits</button>`);$('play').onclick=()=>{if(mode==='coderot'){showDialog('<h2>Gears, get ready!</h2><p>A tiny rocket leads the way to the tower.</p><svg width="80" height="35" viewBox="0 0 80 35"><path fill="#e75d5d" d="M55 17L20 5v24z"/><path fill="#76dcd0" d="M20 10H5v14h15z"/><circle cx="36" cy="17" r="5" fill="white"/></svg><div class="loading"><i></i></div>');setTimeout(()=>{closeDialog();notice('Come on phighter gears! Place your first defense, then start the wave.');},1000);}else closeDialog();};if(mode==='coderot'){try{let saved=localStorage.getItem('coderot-checkpoint');if(saved){let b=document.createElement('button');b.textContent='Resume saved story';$('dialog').appendChild(b);b.onclick=()=>{try{importCode(saved);closeDialog();notice('Saved story restored.');}catch(e){notice('That browser save cannot be restored.');}};}}catch(e){}}$('titleSettings').onclick=settings;$('credits').onclick=()=>{showDialog('<h2>Credits</h2><p>A classroom game design, implemented as a standalone browser game. All illustrated game art and synthesized sound effects are included in this file.</p><button id="back">Back</button>');$('back').onclick=titleScreen;};}
function settings(){showDialog(`<h2>Settings</h2><p>Sound is optional. All gameplay has visible feedback.</p><label><input id="soundOpt" type="checkbox" ${sound?'checked':''}> ${mode==='shoes'?'Original beat and sound effects':'Synthesized sound effects'}</label><button id="done">Return to game</button>`);$('soundOpt').onchange=e=>{sound=e.target.checked;tone();};$('done').onclick=closeDialog;}
function towerCost(i){if(!state.freeUsed&&((['chimps','bread'].includes(mode)&&i===0)||mode==='shoes'))return 0;return C.towers[i][1];}
function addTower(type,x,y,charge=true){let def=C.towers[type],cost=towerCost(type);if(charge&&state.money<cost){notice('Not enough funds.');tone(140,.2);return false;}if(charge)state.money-=cost;state.freeUsed=true;let t={id:++state.uid,type,x,y,row:Math.floor((y-grid.y)/(grid.h/5)),level:1,hp:mode==='chimps'?35:mode==='coderot'?65:80,maxHp:mode==='chimps'?35:mode==='coderot'?65:80,cooldown:0};state.towers.push(t);selectedId=t.id;selectedType=null;pending=null;tone(mode==='cars'?620:440,.12);updateUI();if(mode==='cars'&&state.money<=0)end(false,'Out of money. The wash shop is bankrupt.');return true;}
function validPlace(p){if(laneMode)return p.x>=grid.x&&p.x<grid.x+grid.w&&p.y>=grid.y&&p.y<grid.y+grid.h&&!state.towers.some(t=>Math.abs(t.x-p.x)<30&&Math.abs(t.y-p.y)<30);return p.x>35&&p.x<840&&p.y>40&&p.y<500&&pathDistance(p.x,p.y)>43&&!state.towers.some(t=>dist(t,p)<55);}
function snap(p){if(!laneMode)return p;let c=clamp(Math.floor((p.x-grid.x)/(grid.w/8)),0,7),r=clamp(Math.floor((p.y-grid.y)/(grid.h/5)),0,4);return{x:grid.x+(c+.5)*grid.w/8,y:grid.y+(r+.5)*grid.h/5};}
function place(p){if(state.over||modal)return;let target=state.towers.find(t=>dist(t,p)<30);if(target){selectedId=target.id;selectedType=null;updateUI();return;}if(selectedType===null){notice('Choose a defender from the shop first.');return;}if(laneMode&&(p.x<grid.x||p.x>grid.x+grid.w||p.y<grid.y||p.y>grid.y+grid.h)){notice('Place defenders on a grass square.');return;}p=snap(p);if(!validPlace(p)){notice(laneMode?'That square is occupied.':'Choose an empty place away from the lane.');tone(170,.13);return;}if(mode==='coderot'){pending={type:selectedType,...p};showDialog('<h2>Place your phighter here?</h2><p>Choose Yes to commit or No to move somewhere else.</p><button id="yes">Yes, place here</button><button id="no">No, move it</button>');$('yes').onclick=()=>{closeDialog();if(pending)addTower(pending.type,pending.x,pending.y);};$('no').onclick=()=>{pending=null;closeDialog();};}else addTower(selectedType,p.x,p.y);}
function upgradeCost(t){return mode==='chimps'?4*t.level:mode==='bread'?60*t.level:mode==='shoes'?3*t.level:mode==='cars'?100*t.level:35*t.level;}
function upgrade(){let t=state.towers.find(t=>t.id===selectedId);if(!t||state.over)return;let cost=upgradeCost(t);if(state.money<cost){notice('Not enough funds.');tone(130,.18);return;}if(mode!=='shoes'&&t.level>=5){notice('Maximum upgrade reached.');return;}state.money-=cost;t.level++;t.maxHp+=20;t.hp=t.maxHp;tone(740,.2);notice(`${C.towers[t.type][0]} upgraded to level ${t.level}.`);updateUI();if(mode==='cars'&&state.money<=0)end(false,'Out of money. The wash shop is bankrupt.');}
function makeEnemy(i,boss=false){let row=i%5,p=laneMode?{x:940+i%2*25,y:grid.y+(row+.5)*grid.h/5}:pointAt(0);let hp=mode==='bread'?120+(boss?480:0):mode==='shoes'?(boss?20+state.wave*2:1):mode==='cars'?55+(state.wave-1)*5+(i%6)*10:mode==='chimps'?(boss?70+state.level*10:7+state.level*1.7+state.subwave*.6):35+state.wave*8+(boss?100:0);let e={id:++state.uid,...p,row,d:0,hp,maxHp:hp,speed:mode==='bread'?22:mode==='shoes'?42+Math.min(60,state.wave*2):mode==='cars'?35:mode==='chimps'?12+Math.min(15,state.level*.2):17+Math.min(20,state.wave),type:((state.wave-1)*4+i)%6,boss,slow:0,hit:0,attack:0,clean:false,infected:false};return e;}
function nextWave(){if(state.over||modal)return;if(mode!=='bread'&&mode!=='cars'&&state.running)return;if(mode!=='cars'&&!state.towers.some(t=>!(mode==='bread'&&t.type===2))){notice('Place a defender first. Your starter can be free.');return;}if(!state.running&&(mode!=='chimps'||state.subwave===0))checkpoint();state.running=true;state.breakTime=0;state.wave++;state.rain=mode==='shoes'&&state.wave%4===0;if(mode==='chimps')state.subwave++;let count=mode==='cars'?4:mode==='bread'?Math.min(100,3+state.wave):mode==='shoes'?6+state.wave*2:mode==='chimps'?5+Math.min(20,state.level)+Math.floor(state.subwave/2):4+state.wave*2;let start=state.queue.length;for(let i=0;i<count;i++)state.queue.push(makeEnemy(start+i,false));if((mode==='shoes'||mode==='bread')&&state.wave%5===0)state.queue.push(makeEnemy(0,true));if(mode==='chimps'&&state.level%10===0&&state.subwave===10)state.queue.push(makeEnemy(2,true));if(mode==='coderot'&&state.wave%5===0)state.queue.push(makeEnemy(2,true));state.spawnTimer=0;tone(590,.12);notice(state.rain?'Purple rain! All KO earnings are doubled.':mode==='cars'?'Fleet queued. One car enters only after the previous car exits.':`Wave ${state.wave} begins.`);updateUI();}
function end(win,reason){state.over=true;state.running=false;state.won=win;tone(win?880:90,.6);showDialog(`<h2>${win?'You win!':mode==='coderot'?'The tower is infected':'Defense failed'}</h2><p>${reason}</p><p>${mode==='cars'?`Cleaned ${state.cleaned} cars; ${state.junked} to the junkyard.`:`Score: ${state.score}. Wave ${state.wave}.`}</p><button id="again">${mode==='chimps'?'Retry this level':'Try again'}</button>`);if(mode==='coderot')$('dialog').style.boxShadow=win?'0 0 70px #ffdf5570':'0 0 70px #ff303070';$('again').onclick=()=>{if(mode==='chimps')retry();else{fresh();closeDialog();}};}
function retry(){if(state.checkpoint){let cp=JSON.parse(JSON.stringify(state.checkpoint));state={...cp,effects:[],checkpoint:cp,over:false,paused:false,running:false,queue:[],enemies:[],breakTime:0};if(mode==='chimps'){state.subwave=0;state.wave=(state.level-1)*10;state.levelTime=0;}selectedId=null;$('pause').textContent='Pause';closeDialog();updateUI();notice('Restarted from the beginning of this round.');}else{fresh();closeDialog();}}
function roundEnd(){state.running=false;if(mode==='bread'){for(const t of state.towers)if(t.type===2)state.money=Math.min(5e10,state.money+20*t.level);if(state.wave===1000)notice('1,000 waves defended! You win. Continue for endless play.');else notice('Wave complete. Bread trees have paid out.');}else if(mode==='chimps'){if(state.subwave>=10){if(state.level===100){end(true,'All five stories complete. The forest is safe.');return;}state.level++;state.story=Math.ceil(state.level/20);state.subwave=0;state.levelTime=0;checkpoint();notice(`Level complete. Story ${state.story}, level ${state.level} is ready.`);}else notice('Wave cleared. Place and upgrade before continuing.');}else if(mode==='coderot'){state.breakTime=5;notice('Wave cleared! Five seconds to shop.');}else notice(mode==='cars'?'All cars processed. Send the next group when ready.':'Shoes cleared. Upgrade or start the next wave.');updateUI();}
function reward(e){let amount=mode==='shoes'?Math.floor(rnd(5,8))*(state.rain?2:1):C.kill;state.money=Math.min(mode==='bread'?5e10:1e12,state.money+amount);state.score++;state.effects.push({kind:'text',x:e.x,y:e.y,text:`+${amount}`,life:.7});tone(mode==='shoes'?660:520,.035,'triangle',.014);}
function tick(dt){if(!state||modal||state.paused||state.over)return;state.time+=dt;if(mode==='shoes'&&sound&&state.time-lastMusic>.32){lastMusic=state.time;let notes=[110,165,130.81,196,110,146.83,130.81,164.81];tone(notes[Math.floor(state.time/.32)%notes.length],.2,'triangle',.025);}if(mode==='chimps'&&state.running){state.levelTime+=dt;if(state.levelTime>=300){end(false,'Five minutes elapsed. Retry this level.');return;}}if(state.breakTime>0){state.breakTime-=dt;if(state.breakTime<=0)nextWave();}if(state.running&&state.queue.length){state.spawnTimer-=dt;if(state.spawnTimer<=0&&state.enemies.length===0){let e=state.queue.shift();state.enemies.push(e);if(mode==='cars')tone(90,.22,'sawtooth',.012);if(mode==='bread')tone(130,.06,'triangle',.015);if(mode==='chimps')tone(110,.18,'sawtooth',.009);state.spawnTimer=mode==='cars'?.65:mode==='bread'?1.8:mode==='shoes'?.7:1.2;}}
for(const t of state.towers){t.cooldown-=dt;let def=C.towers[t.type];if(!def[2]||t.cooldown>0)continue;let range=def[3]+(t.level-1)*(mode==='shoes'?8:16),targets=state.enemies.filter(e=>e.hp>0&&!e.clean&&(!laneMode||e.row===t.row)&&dist(t,e)<range).sort((a,b)=>laneMode?a.x-b.x:b.d-a.d);if(!targets.length)continue;let e=targets[0];t.cooldown=Math.max(.12,def[4]/(1+(t.level-1)*.18));let dmg=def[2]*(1+(t.level-1)*.7);if(mode==='cars')tone(1700,.055,'sawtooth',.006);e.hp-=dmg;e.hit=.12;if(mode==='shoes'&&t.type===1)e.slow=2.3;if(mode==='shoes'&&t.type===2)e.slow=2;if((mode==='chimps'&&t.type===2)||(mode==='coderot'&&t.type===1)){for(let other of targets.slice(1))if(dist(e,other)<65)other.hp-=dmg*.6;}
state.effects.push({kind:mode==='cars'?'water':'shot',x:t.x,y:t.y,tx:e.x,ty:e.y,color:mode==='cars'?'#92eaff':mode==='bread'?'#d8ffff':mode==='shoes'?(t.type===2?'#9ce86b':t.type===1?'#ce87ff':'#eab361'):mode==='coderot'?'#89e9d8':'#bda274',life:.2,type:t.type});if(mode==='cars'&&e.hp<=0){e.clean=true;e.hp=0;tone(900,.09,'sine',.018);} }
for(const e of state.enemies){e.hit-=dt;e.slow=Math.max(0,e.slow-dt);if(e.hp<=0&&mode!=='cars'){if(!e.dead){e.dead=true;reward(e);}continue;}let blocked=null;if(laneMode)blocked=state.towers.filter(t=>t.row===e.row&&e.x>=t.x-10&&e.x-t.x<38).sort((a,b)=>b.x-a.x)[0];if(blocked){e.attack-=dt;if(e.attack<=0){blocked.hp-=mode==='chimps'?(e.boss?15:7):(e.boss?20:10);e.attack=1;state.effects.push({kind:'ring',x:blocked.x,y:blocked.y,color:'#ed6555',life:.25});}}else if(laneMode)e.x-=e.speed*dt*(e.slow?.25:1);else{e.d+=e.speed*dt*(e.slow?.25:1);Object.assign(e,pointAt(e.d));}if(mode==='shoes'&&e.boss){e.attack-=dt;if(e.attack<=0&&state.towers.length){let t=state.towers.reduce((a,b)=>dist(a,e)<dist(b,e)?a:b);t.hp-=12;e.attack=2;state.effects.push({kind:'shot',x:e.x,y:e.y,tx:t.x,ty:t.y,color:'#92e099',life:.5,type:4});}}
if(laneMode?e.x<85:e.d>=pathLength){e.dead=true;if(mode==='cars'){if(e.clean){let pay=80+e.type*15;state.money+=pay;state.cleaned++;state.effects.push({kind:'text',x:780,y:350,text:`Garage +$${pay}`,life:1});}else{state.money-=50;state.junked++;state.effects.push({kind:'text',x:490,y:190,text:'Junkyard −$50',life:1});}if(state.money<=0){end(false,'Out of money. Too many cars reached the junkyard.');return;}}else{state.hp-=mode==='bread'?40:e.boss?5:mode==='coderot'?25:1;if(state.hp<=0){end(false,mode==='chimps'?'A gorilla reached your territory.':mode==='bread'?'The bread bag has been overrun by mold.':mode==='shoes'?'The designer shoes reached the exit.':'Coderot breached the tower.');return;}}}}
let fallen=state.towers.filter(t=>t.hp<=0);for(const t of fallen)if(mode==='coderot'){let e=makeEnemy(t.row);e.x=t.x;e.y=t.y;e.row=t.row;e.hp=40;e.maxHp=40;e.infected=true;state.enemies.push(e);notice('A fallen phighter has become infected!');}state.towers=state.towers.filter(t=>t.hp>0);if(fallen.length&&mode==='coderot'&&!state.towers.length){end(false,'All phighters fell to coderot.');return;}if(mode==='chimps'&&!state.towers.length){state.freeUsed=false;}

function importCode(value){let v=JSON.parse(decodeURIComponent(escape(atob(value.trim()))));if(v.game!==C.mode||v.version!==1||!v.state||!Number.isFinite(v.state.money)||!Array.isArray(v.state.towers)||!Array.isArray(v.state.enemies)||v.state.towers.length>500||v.state.enemies.length>200||v.state.money<0||v.state.level<1||v.state.level>100)throw Error('Invalid save');let s=v.state;for(let k of ['hp','maxHp','wave','level','subwave','score','time','levelTime','story','baseLevel','uid','breakTime'])if(!Number.isFinite(s[k])||s[k]<0)throw Error('Invalid state');if(!Array.isArray(s.queue)||s.queue.length>10000)throw Error('Invalid queue');for(let e of [...s.enemies,...s.queue])if(!['x','y','hp','maxHp','speed','row','type'].every(k=>Number.isFinite(e[k])))throw Error('Invalid enemy');if(v.checkpoint&&(!Number.isFinite(v.checkpoint.money)||!Array.isArray(v.checkpoint.towers)))throw Error('Invalid checkpoint');for(let t of s.towers)if(!Number.isInteger(t.type)||!C.towers[t.type]||![t.x,t.y,t.hp,t.level].every(Number.isFinite)||t.level<1)throw Error('Invalid defender');state={...s,effects:[],checkpoint:v.checkpoint||null,paused:false};if(!state.checkpoint)checkpoint();selectedId=null;updateUI();}

document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(modal){if($('play'))$('play').click();return;}if(mode==='coderot'){selectedType=(selectedType===null?0:selectedType+1)%C.towers.length;selectedId=null;updateUI();tone(300+selectedType*100);}else if(mode==='cars')nextWave();else $('pause').click();}if(laneMode&&!modal&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'].includes(e.code)){e.preventDefault();selectionCursor.col=clamp(selectionCursor.col+(['ArrowRight','KeyD'].includes(e.code)?1:['ArrowLeft','KeyA'].includes(e.code)?-1:0),0,7);selectionCursor.row=clamp(selectionCursor.row+(['ArrowDown','KeyS'].includes(e.code)?1:['ArrowUp','KeyW'].includes(e.code)?-1:0),0,4);hover={x:grid.x+(selectionCursor.col+.5)*grid.w/8,y:grid.y+(selectionCursor.row+.5)*grid.h/5};}if(e.code==='Enter'&&hover&&!modal)place(hover);if(e.code==='Escape'&&modal)closeDialog();});
if(mode!=='chimps'){$('save').classList.add('hidden');$('load').classList.add('hidden');}if(mode==='cars'){$('custom').classList.remove('hidden');$('shopTitle').textContent='Pressure washers';$('detailTitle').textContent='Car custom shop';$('retry').textContent='Restart shop';$('details').textContent='Next fleet: Honda, Toyota, Porsche, Aston Martin, Lamborghini and Mercedes. Upgrade rusty washers into luxury cleaning machines. Every clean car pays $80–$155.';}else $('details').textContent=C.help;if(mode==='coderot'){$('mini').classList.remove('hidden');$('baseUpgrade').classList.remove('hidden');$('retry').textContent='Restart round';}if(mode==='bread')$('retry').textContent='Restart a round';if(mode==='shoes')$('retry').textContent='Restart round';
for(let id of ['paint','rims','exhaust'])$(id).onchange=()=>{tone(660,.14,'triangle');setTimeout(()=>tone(990,.14,'triangle'),80);};
fresh();titleScreen();
function animate(t){let dt=Math.min(.05,(t-frameTime)/1000||0);frameTime=t;tick(dt*speed);draw();requestAnimationFrame(animate);}requestAnimationFrame(animate);
