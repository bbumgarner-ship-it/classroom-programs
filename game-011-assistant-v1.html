<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token Clicker</title><style>body{margin:0;color:#4e3900;font:18px Arial;background:repeating-linear-gradient(120deg,#fff2a0 0 60px,#ffdf66 60px 120px);background-size:300% 300%;animation:bg 30s linear infinite}[hidden]{display:none!important}header{text-align:center;background:#ffe04f;padding:20px}main{display:grid;grid-template-columns:1fr 250px;min-height:360px;max-width:1000px;margin:auto}section{display:grid;place-content:center;text-align:center}aside{padding:25px;background:#fff2a0;border-left:3px solid #b68c00}button{cursor:pointer;border:2px solid #9a7400;border-radius:8px;background:#ffdf44;padding:15px;font-weight:bold;font-size:17px;margin:8px}button:disabled{opacity:.5;cursor:default}#token{font-size:40px;border-radius:50%;width:220px;height:220px;background:#ffcc00;box-shadow:0 9px #bd9200}#token:active{transform:translateY(-12px)}#welcome{text-align:center;margin:60px}#msg{min-height:40px;text-align:center}footer{text-align:center}@keyframes bg{50%{background-position:100% 100%}}@media(max-width:600px){main{grid-template-columns:1fr}aside{border-left:0;text-align:center}}</style><header><h1>Token Clicker</h1><h2>Tokens: <span id="score">0</span></h2></header><div id="welcome"><button id="play">Play Token Clicker</button></div><main id="game" hidden><section><p>Click the Token to gain tokens.</p><button id="token">TOKEN</button><p><span id="power">1</span> token(s) per click</p></section><aside><h2>Upgrades</h2><button id="buy">Buy double clicks<br>10 tokens</button><p id="bought"></p><button id="rebirth">Rebirth<br>1,000 tokens</button><p>Start again with no tokens or upgrade, but permanently add 2 tokens per click.</p><p>Rebirths: <span id="rebs">0</span></p></aside></main><p id="msg"></p><footer><label><input type="checkbox" id="sound" checked> Sound</label></footer><script>let points=0,rebirths=0,upgraded=false,ctx;const $=id=>document.getElementById(id);function power(){return 1+rebirths*2+(upgraded?1:0)}function render(){$('score').textContent=points;$('power').textContent=power();$('rebs').textContent=rebirths;$('buy').disabled=upgraded||points<10;$('rebirth').disabled=points<1000;$('bought').textContent=upgraded?'Double-click upgrade owned.':'';}function ding(){if(!$('sound').checked)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.15);o.start();o.stop(ctx.currentTime+.15)}catch{}}function click(){points+=power();ding();$('token').animate([{transform:'translateY(-14px)'},{transform:'translateY(0)'}],150);render()}$('play').onclick=()=>{$('welcome').remove();$('game').hidden=false;render()};$('token').onclick=click;$('buy').onclick=()=>{if(points>=10&&!upgraded){points-=10;upgraded=true;render()}};$('rebirth').onclick=()=>{if(points>=1000){points=0;upgraded=false;rebirths++;$('msg').textContent='Reborn! +2 tokens per click.';render()}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!$('game').hidden&&e.target===document.body){e.preventDefault();click()}});render();</script></html>
