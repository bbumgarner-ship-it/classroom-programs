<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chicken Clicker</title><style>body{font:20px system-ui;text-align:center;margin:0;background:linear-gradient(135deg,#ffe187,#b4ecc9,#cdb3f4);color:#36200b;min-height:100vh}h1{padding:24px;margin:0}button{font:inherit;border:2px solid #694925;background:#fff8cf;padding:12px;border-radius:12px;cursor:pointer}#bird{display:block;margin:25px auto;width:230px;height:230px;background:#ffdb64;font-size:100px;border-radius:50%;touch-action:manipulation}#bird:active{transform:scale(.94)}.panel{background:#ffffffaa;padding:16px;margin:15px auto;max-width:700px}#count{font-size:42px}#screen[hidden],#load[hidden],#start[hidden]{display:none}progress{width:250px}</style><h1>Chicken Clicker</h1><button id="start">Start</button><div id="load" hidden>Loading… <span id="percent">0</span>%<p><progress id="bar" max="100" value="0"></progress></p></div><main id="screen" hidden><p>Start clicking. Use the chicken or space bar.</p><div id="count">0 chickens</div><button id="bird" aria-label="Click chicken">🐔</button><div id="numbers"></div><div class="panel"><div id="stats"></div><p id="upgrades"></p><button id="save">Save game</button> <button id="reward">Daily reward</button> <button id="sound">Music: off</button><p id="message"></p></div></main><script>
const $=x=>document.getElementById(x),key='chicken-clicker-local';let s={chickens:0,clicks:0,seconds:0,level:0,date:'',today:0,day:new Date().toDateString()},started=false,last=0,combo=1,music=false,ac,step=0;try{Object.assign(s,JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){}if(s.day!==new Date().toDateString()){s.day=new Date().toDateString();s.today=0}function draw(){$('count').textContent=Math.floor(s.chickens).toLocaleString()+' chickens';$('stats').textContent='Clicks: '+s.clicks.toLocaleString()+' · Today: '+s.today.toLocaleString()+' · Time: '+s.seconds+' seconds · Streak multiplier: ×'+combo;$('upgrades').textContent='Upgrades at 10,000 / 100,000 / 100,000,000 clicks. Unlocked: '+s.level+' · Auto: '+s.level+'/second';$('bird').textContent=['🐔','🐓','🐤','🐣'][s.level];}function click(){if(!started)return;const now=Date.now();combo=now-last<700?Math.min(20,combo+1):1;last=now;let n=combo*(s.level+1);s.chickens+=n;s.clicks++;s.today++;s.level=s.clicks>=100000000?3:s.clicks>=100000?2:s.clicks>=10000?1:0;$('numbers').textContent='+'+n;draw()}$('start').onclick=()=>{$('start').hidden=true;$('load').hidden=false;let n=0,t=setInterval(()=>{n+=10;$('bar').value=n;$('percent').textContent=n;if(n>=100){clearInterval(t);$('load').hidden=true;$('screen').hidden=false;started=true;draw()}},60)};$('bird').onclick=click;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target.tagName!=='BUTTON'){e.preventDefault();click()}});$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(s));$('message').textContent='Saved.'}catch(e){$('message').textContent='Saving is unavailable in this frame.'}};$('reward').onclick=()=>{let d=new Date().toDateString();if(s.date===d){$('message').textContent='Daily reward already claimed.';return}s.date=d;s.chickens+=100;$('message').textContent='Daily reward: 100 chickens.';draw()};$('sound').onclick=()=>{music=!music;if(music)ac=ac||new(window.AudioContext||window.webkitAudioContext)();$('sound').textContent='Music: '+(music?'on':'off')};setInterval(()=>{if(!started)return;s.seconds++;s.chickens+=s.level;if(Date.now()-last>700)combo=1;draw();if(music&&ac){let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=[261,329,392,523][step++%4];g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}},1000);
</script></html>
