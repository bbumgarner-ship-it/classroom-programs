<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Clicker</title><style>body{margin:0;background:#aee5fa;color:#073b55;text-align:center;font:20px Arial;min-height:100vh}h1{padding-top:35px}#shark{border:0;background:none;font-size:150px;cursor:pointer;transition:transform .1s;touch-action:manipulation}#shark:active{transform:scale(1.12)}#bubble{min-height:35px}progress{width:250px;accent-color:#d74432}small{display:block;font-size:15px;margin:20px}</style><h1>Shark Clicker</h1><p>Click the shark. Each click makes it more aggressive.</p><h2>Clicks: <span id="count">0</span></h2><button id="shark" aria-label="Click shark">🦈</button><p id="bubble">Hello!</p><label>Aggression <progress id="rage" max="100" value="0"></progress></label><small id="mood">Calm shark</small><script>let clicks=0;const shark=document.getElementById('shark');shark.onclick=()=>{clicks++;document.getElementById('count').textContent=clicks;let rage=Math.min(100,clicks);document.getElementById('rage').value=rage;document.getElementById('mood').textContent=rage<20?'Alert shark':rage<50?'Irritated shark':rage<80?'Angry shark':'Very aggressive shark';document.getElementById('bubble').textContent=rage<20?'Hey!':rage<50?'Watch those clicks!':rage<80?'Grrr!':'CHOMP!';shark.style.filter=`drop-shadow(0 0 ${rage/4}px #e74b37)`;};</script></html>
