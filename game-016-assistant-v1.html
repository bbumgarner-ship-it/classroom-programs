<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Clicker</title><style>body{font:18px system-ui;background:#fff0df;color:#4d3548;text-align:center;padding:22px}main{max-width:760px;margin:auto}button{font:inherit;background:#f4c5cc;color:#4d3548;border:2px solid #d69ba8;border-radius:12px;margin:7px;padding:14px;cursor:pointer}button:disabled{opacity:.4}#cat{background:#ffe4ba;position:relative;min-width:190px;width:230px;height:210px}#cat svg{display:block;width:100%;height:100%;overflow:visible}#decorate{background:#fff8ee;border:2px solid #d69ba8;border-radius:12px;padding:16px;margin:16px auto;max-width:500px}#decorate label{display:inline-block;margin:8px}#decorate select{font:inherit;padding:6px}#decorate[hidden],.accessory[hidden]{display:none}#awards{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px auto}.award{padding:8px 12px;border:2px solid #c8b6bf;border-radius:12px;background:#f6eef0;color:#695662}.award.earned{background:#ffe3a0;border-color:#b98426;color:#684513}#cat:active{transform:scale(.95)}#shop{display:flex;flex-wrap:wrap;justify-content:center}#shop button{max-width:200px}.pop{position:fixed;font-size:34px;pointer-events:none;animation:up .7s forwards}@keyframes up{to{transform:translateY(-100px);opacity:0}}#menu{display:none}output{font-size:28px}</style><main><button id="menuButton" aria-label="Open cat-tail menu">≋ Menu</button><div id="menu"><button id="save">Save</button><button id="decorateButton" aria-expanded="false" aria-controls="decorate">Decorate Cat</button><button id="restart">Restart</button><small>Save uses this device, when storage is available.</small></div><h1>Cat Clicker</h1><output id="paws"></output><p id="counts"></p><button id="cat" aria-label="Click the cat"><svg viewBox="0 0 220 180" aria-hidden="true"><path d="M153 134Q211 148 196 76" fill="none" stroke="var(--fur,#ffe4ba)" stroke-width="20" stroke-linecap="round"/><ellipse cx="110" cy="123" rx="54" ry="39" fill="var(--fur,#ffe4ba)" stroke="#785648" stroke-width="3"/><path d="M64 67L57 20L91 39Q110 32 129 39L163 20L156 67Z" fill="var(--fur,#ffe4ba)" stroke="#785648" stroke-width="3"/><path d="M64 30L69 52L84 43M156 30L151 52L136 43" fill="#e6a6b3"/><ellipse cx="110" cy="70" rx="49" ry="37" fill="var(--fur,#ffe4ba)" stroke="#785648" stroke-width="3"/><ellipse cx="90" cy="65" rx="5" ry="8" fill="#3b3132"/><ellipse cx="130" cy="65" rx="5" ry="8" fill="#3b3132"/><path d="M104 77L116 77L110 84Z" fill="#c76a88"/><path d="M110 84Q101 95 94 86M110 84Q119 95 126 86M77 80L47 75M77 87L45 91M143 80L173 75M143 87L175 91" fill="none" stroke="#785648" stroke-width="2"/><path d="M78 142V163M97 145V164M123 145V164M143 142V163" stroke="var(--fur,#ffe4ba)" stroke-width="16" stroke-linecap="round"/><g id="catCollar" class="accessory" hidden><path d="M75 99Q110 113 145 99" fill="none" stroke="#3478ae" stroke-width="10"/><circle cx="110" cy="110" r="6" fill="#e9bc44"/></g><g id="catBow" class="accessory" hidden fill="#bc4b73" stroke="#81354f" stroke-width="2"><path d="M110 108L90 98V118ZM110 108L130 98V118Z"/><circle cx="110" cy="108" r="5"/></g><g id="catShoes" class="accessory" hidden fill="var(--shoe,#397cca)" stroke="#4d3548" stroke-width="2"><path d="M68 157h19v13H65q-3-9 3-13M88 157h18v13H86q-2-9 2-13M114 157h18v13h-22q-2-9 4-13M134 157h18v13h-22q-2-9 4-13"/></g><g id="catCap" class="accessory" hidden><path d="M81 28q29-45 58 0z" fill="#447cb5" stroke="#29475d" stroke-width="3"/><path d="M78 27h76q8 10-9 11H81z" fill="#315b87"/></g><g id="catCrown" class="accessory" hidden><path d="m82 28-5-31 20 14 13-24 13 24 20-14-5 31z" fill="#f4cd53" stroke="#a37627" stroke-width="3"/><circle cx="110" cy="15" r="4" fill="#ce4c70"/></g><g id="catHat" class="accessory" hidden fill="#4d3548"><path d="M88 3H132V35H88Z"/><rect x="78" y="30" width="64" height="9" rx="4"/><path d="M88 23H132" stroke="#d5718f" stroke-width="7"/></g></svg></button><p id="message" role="status">Click the cat to collect paws.</p><div id="shop"><button id="tail">🐈 Cat tail<br>50 paws · +1/click</button><button id="ears">😺 Cat ears<br>100 paws · +2/click</button><button id="auto">🐾 Automatic cat<br>150 paws · +1 paw/sec</button><button id="candy">🍬 Candy clicker<br>250 paws · +5/click</button></div><section id="decorate" hidden><h2>Decorate Cat</h2><label>Fur color <select id="color"><option value="#ffe4ba">Orange</option><option value="#ddd">Gray</option><option value="#edbbdd">Pink</option></select></label><label>Hat <select id="head"><option value="none">None</option><option value="hat">Top hat</option><option value="cap">Blue cap</option><option value="crown">Crown</option></select></label><label>Necklace or bow tie <select id="accessory"><option value="none">None</option><option value="collar">Blue necklace with gold pendant</option><option value="bow">Pink bow tie</option></select></label><label>Shoes <select id="shoes"><option value="none">None</option><option value="#397cca">Blue</option><option value="#eb8b32">Orange</option><option value="#9060bd">Purple</option><option value="#ce4343">Red</option><option value="#ed87b9">Pink</option><option value="#ffffff">White</option><option value="#f2d24a">Yellow</option></select></label><p>Wear a hat, necklace or bow tie, and shoes together.</p></section><section aria-label="Click awards"><h2>Click awards</h2><div id="awards"></div></section> <label><input id="sound" type="checkbox" checked> Meow sound</label></main><script>
const $=x=>document.getElementById(x);let s={paws:0,clicks:0,power:1,tails:0,ears:0,auto:0,candy:0,color:'#ffe4ba',accessory:'none',head:'none',shoes:'none'},audio;try{Object.assign(s,JSON.parse(localStorage.getItem('cat-paws-save')||'{}'))}catch{}if(s.accessory==='hat'){s.head='hat';s.accessory='none'}const items=[['tail','tails',50,1,'Cat tail'],['ears','ears',100,2,'Cat ears'],['auto','auto',150,0,'Automatic cat'],['candy','candy',250,5,'Candy clicker']],milestones=[10,100,1000];
function price(base,key){return Math.ceil(base*1.5**s[key])}
function render(){$('paws').textContent=Math.floor(s.paws)+' cat paws';$('counts').textContent=s.clicks+' clicks · '+s.power+' paws/click · '+s.auto+'/second · '+s.tails+' tails · '+s.ears+' ears';items.forEach(([id,key,base,power,label])=>{const cost=price(base,key);$(id).disabled=s.paws<cost;$(id).textContent=label+' · '+cost.toLocaleString()+' paws · '+(key==='auto'?'+1 paw/sec':'+'+power+'/click')});$('cat').style.setProperty('--fur',s.color);$('color').value=s.color;$('accessory').value=s.accessory;$('head').value=s.head;$('shoes').value=s.shoes;$('cat').style.setProperty('--shoe',s.shoes==='none'?'#397cca':s.shoes);['collar','bow','hat','cap','crown','shoes'].forEach(name=>{const el=$('cat'+name[0].toUpperCase()+name.slice(1));if(s.accessory===name||s.head===name||(name==='shoes'&&s.shoes!=='none'))el.removeAttribute('hidden');else el.setAttribute('hidden','')});$('awards').replaceChildren();milestones.forEach(goal=>{const badge=document.createElement('span'),earned=s.clicks>=goal;badge.className='award'+(earned?' earned':'');badge.textContent=(earned?'★ Earned: ':'Locked: ')+goal.toLocaleString()+' clicks';$('awards').append(badge)})}
function meow(){if(!$('sound').checked)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(650,audio.currentTime);o.frequency.exponentialRampToValueAtTime(230,audio.currentTime+.25);g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.31)}catch{}}$('cat').onclick=()=>{s.paws+=s.power;s.clicks++;let b=$('cat').getBoundingClientRect(),pop=document.createElement('span');pop.className='pop';pop.textContent='🐈';pop.style.left=(b.left+b.width/2)+'px';pop.style.top=b.top+'px';document.body.append(pop);setTimeout(()=>pop.remove(),750);$('message').textContent='Meow!';meow();if(milestones.includes(s.clicks))$('message').textContent='Award earned: '+s.clicks.toLocaleString()+' clicks!';render()};function buy(base,key,p){const cost=price(base,key);if(s.paws<cost)return;s.paws-=cost;s[key]++;s.power+=p;render()}$('tail').onclick=()=>buy(50,'tails',1);$('ears').onclick=()=>buy(100,'ears',2);$('auto').onclick=()=>buy(150,'auto',0);$('candy').onclick=()=>buy(250,'candy',5);$('menuButton').onclick=()=>$('menu').style.display=$('menu').style.display==='block'?'none':'block';$('save').onclick=()=>{try{localStorage.setItem('cat-paws-save',JSON.stringify(s));$('message').textContent='Saved on this device.'}catch{$('message').textContent='Storage is unavailable in this frame.'}};$('restart').onclick=()=>{s={paws:0,clicks:0,power:1,tails:0,ears:0,auto:0,candy:0,color:'#ffe4ba',accessory:'none',head:'none',shoes:'none'};render();$('message').textContent='Starting again with no paws.'};$('color').onchange=e=>{s.color=e.target.value;render()};$('accessory').onchange=e=>{s.accessory=e.target.value;render()};$('head').onchange=e=>{s.head=e.target.value;render()};$('shoes').onchange=e=>{s.shoes=e.target.value;render()};$('decorateButton').onclick=()=>{$('decorate').hidden=!$('decorate').hidden;$('decorateButton').setAttribute('aria-expanded',String(!$('decorate').hidden))};setInterval(()=>{s.paws+=s.auto;render()},1000);render();
</script></html>
