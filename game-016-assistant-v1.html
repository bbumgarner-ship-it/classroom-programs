<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Clicker</title><style>body{font:18px system-ui;background:#fff0df;color:#4d3548;text-align:center;padding:22px}main{max-width:760px;margin:auto}button{font:inherit;background:#f4c5cc;color:#4d3548;border:2px solid #d69ba8;border-radius:12px;margin:7px;padding:14px;cursor:pointer}button:disabled{opacity:.4}#cat{font-size:100px;background:#ffe4ba;position:relative;min-width:190px}#cat:active{transform:scale(.95)}#shop{display:flex;flex-wrap:wrap;justify-content:center}#shop button{max-width:200px}.pop{position:fixed;font-size:34px;pointer-events:none;animation:up .7s forwards}@keyframes up{to{transform:translateY(-100px);opacity:0}}#menu{display:none}output{font-size:28px}</style><main><button id="menuButton" aria-label="Open cat-tail menu">≋ Menu</button><div id="menu"><button id="save">Save</button><button id="restart">Restart</button><small>Save uses this device, when storage is available.</small></div><h1>Cat Clicker</h1><output id="paws"></output><p id="counts"></p><button id="cat" aria-label="Click the cat">🐈</button><p id="message" role="status">Click the cat to collect paws.</p><div id="shop"><button id="tail">🐈 Cat tail<br>50 paws · +1/click</button><button id="ears">😺 Cat ears<br>100 paws · +2/click</button><button id="auto">🐾 Automatic cat<br>150 paws · +1 paw/sec</button><button id="candy">🍬 Candy clicker<br>250 paws · +5/click</button></div><label>Cat color <select id="color"><option value="#ffe4ba">Orange</option><option value="#ddd">Gray</option><option value="#edbbdd">Pink</option></select></label> <label><input id="sound" type="checkbox" checked> Meow sound</label></main><script>
const $=x=>document.getElementById(x);let s={paws:0,clicks:0,power:1,tails:0,ears:0,auto:0,candy:0,color:'#ffe4ba'},audio;try{Object.assign(s,JSON.parse(localStorage.getItem('cat-paws-save')||'{}'))}catch{}function render(){$('paws').textContent=Math.floor(s.paws)+' cat paws';$('counts').textContent=s.clicks+' clicks · '+s.power+' paws/click · '+s.auto+'/second · '+s.tails+' tails · '+s.ears+' ears';[['tail',50],['ears',100],['auto',150],['candy',250]].forEach(([id,c])=>$(id).disabled=s.paws<c);$('cat').style.background=s.color;$('color').value=s.color}function meow(){if(!$('sound').checked)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(650,audio.currentTime);o.frequency.exponentialRampToValueAtTime(230,audio.currentTime+.25);g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.31)}catch{}}$('cat').onclick=()=>{s.paws+=s.power;s.clicks++;let b=$('cat').getBoundingClientRect(),pop=document.createElement('span');pop.className='pop';pop.textContent='🐈';pop.style.left=(b.left+b.width/2)+'px';pop.style.top=b.top+'px';document.body.append(pop);setTimeout(()=>pop.remove(),750);if(s.clicks%15===0){$('message').textContent='Meow!';meow()}render()};function buy(cost,key,p){if(s.paws<cost)return;s.paws-=cost;s[key]++;s.power+=p;render()}$('tail').onclick=()=>buy(50,'tails',1);$('ears').onclick=()=>buy(100,'ears',2);$('auto').onclick=()=>buy(150,'auto',0);$('candy').onclick=()=>buy(250,'candy',5);$('menuButton').onclick=()=>$('menu').style.display=$('menu').style.display==='block'?'none':'block';$('save').onclick=()=>{try{localStorage.setItem('cat-paws-save',JSON.stringify(s));$('message').textContent='Saved on this device.'}catch{$('message').textContent='Storage is unavailable in this frame.'}};$('restart').onclick=()=>{s={paws:0,clicks:0,power:1,tails:0,ears:0,auto:0,candy:0,color:'#ffe4ba'};render();$('message').textContent='Starting again with no paws.'};$('color').onchange=e=>{s.color=e.target.value;render()};setInterval(()=>{s.paws+=s.auto;render()},1000);render();
</script></html>
