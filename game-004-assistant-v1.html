<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speed Clicker</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui;color:#203225;background:#e8f2df}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px}button,select{font:inherit;padding:12px;border:1px solid #8caa7c;border-radius:9px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.97)}.row{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:18px;background:#ffffffd9;border-radius:14px;margin:16px 0}.stats{font-weight:bold;font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:110px;min-width:210px;min-height:200px;background:#fff7cc}.message{min-height:28px}small{font-size:13px} [hidden]{display:none!important}progress{width:min(65vw,500px);height:24px}#scene{text-align:center}#bosses{margin-top:16px}#track{position:relative;height:230px;margin:16px 0;background:#ffffff50;border:2px solid #ffffff90;border-radius:12px;overflow:hidden}#track:before{content:'';position:absolute;left:0;right:0;top:68%;height:4px;border-top:3px dashed #fff}#track:after{content:'FINISH';position:absolute;right:8%;top:10px;height:92%;border-right:5px dashed #fff;font-size:11px;padding-right:5px;color:#395140}.runner{position:absolute;width:66px;height:100px;left:18%;bottom:36%;transform:translateX(-50%);transition:left .12s linear;z-index:2}.runner svg{width:100%;height:100%;overflow:visible}.runner .limb{transform-box:fill-box;transform-origin:50% 0%}.runner .body{animation:breathe 1.6s ease-in-out infinite;transform-origin:center}.moving .front{animation:stride .26s ease-in-out infinite alternate}.moving .back{animation:stride .26s ease-in-out infinite alternate-reverse}.moving .body{animation:breathe .25s ease-in-out infinite alternate}#rival{bottom:5%;color:#b43b42}#player{color:#2369b7}#petFollower{position:absolute;left:8%;bottom:33%;width:48px;height:55px;transform:translateX(-50%);transition:left .38s ease-out;z-index:3}#petFollower svg{width:100%;height:100%;animation:pet-hop .6s ease-in-out infinite}#petFollower .pet-wing{display:none}#petFollower[data-level="5"] .pet-wing{display:block}#petFollower[data-level="1"] .pet-ear{transform:scaleY(1.7);transform-origin:50% 100%;transform-box:fill-box}#petFollower[data-level="4"] .pet-mane{stroke-width:9;stroke:#b36d27}#click{font-size:24px;min-height:66px;min-width:230px}.runner-label{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:bold;white-space:nowrap}#petControls{font-size:14px;margin-top:8px}@keyframes stride{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes pet-hop{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.runner .body,.moving .front,.moving .back,#petFollower svg{animation:none}.runner,#petFollower{transition:none}}</style><main><h1>Speed Clicker</h1><div id="loading" class="panel">Loading the race tracks…</div><div id="menu" class="panel" hidden><p>Click to gain speed. Race bosses, hatch pets, and unlock five worlds.</p><div class="row"><button id="play">Play</button><button id="continue">Continue game</button><button id="new">New game</button><button id="worldMenu">Worlds</button></div></div><section id="game" hidden><div class="panel stats" id="stats"></div><div class="panel" id="scene"><h2 id="worldName"></h2><div id="clicks"></div><div id="track" aria-label="Your character and equipped pet on the race track">
<div id="player" class="runner"><span class="runner-label">You</span><svg viewBox="0 0 66 100" aria-hidden="true"><g class="body"><path class="limb back" d="m32 58 14 28 10 6" fill="none" stroke="#253d63" stroke-width="9" stroke-linecap="round"/><path class="limb front" d="m30 58-11 29-9 5" fill="none" stroke="#263e62" stroke-width="9" stroke-linecap="round"/><path class="limb back" d="m39 35 12 18 9-10" fill="none" stroke="#b6744e" stroke-width="7" stroke-linecap="round"/><path d="M21 29q12-6 24 0l-4 34H24z" fill="currentColor"/><path d="m28 32 7 14 5-13" fill="none" stroke="#fff" stroke-width="3"/><path class="limb front" d="m23 35-10 17 9 10" fill="none" stroke="#bd8056" stroke-width="7" stroke-linecap="round"/><circle cx="33" cy="17" r="13" fill="#c78a61"/><path d="M20 15q-1-20 20-11 10 3 7 15l-8-10-18 8" fill="#3a2e2b"/><circle cx="38" cy="17" r="1.7" fill="#252831"/><path d="m36 23 5-1" stroke="#6e3b2b" stroke-width="1.5"/></g></svg></div>
<div id="petFollower" hidden><svg viewBox="0 0 60 64" aria-hidden="true"><g class="pet-wing" fill="#90c87a" stroke="#326849" stroke-width="2"><path d="m15 37-14-24 19 9 7 22m13-6 18-25-3 24-12 12"/></g><path d="m40 43 15-8-3 16-15 3" fill="currentColor"/><ellipse cx="29" cy="44" rx="19" ry="12" fill="currentColor"/><path d="m18 51-3 9m24-9 4 9" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path class="pet-ear" d="m13 27-2-18 14 10m9 6 12-17 1 22" fill="currentColor" stroke="#674f47" stroke-width="2"/><circle class="pet-mane" cx="28" cy="29" r="18" fill="currentColor"/><ellipse cx="34" cy="35" rx="9" ry="7" fill="#fff4de"/><circle cx="23" cy="27" r="2" fill="#283342"/><circle cx="37" cy="27" r="2" fill="#283342"/><path d="m30 32 7 0-3 4z" fill="#283342"/></svg></div>
<div id="rival" class="runner moving" hidden><span class="runner-label" id="rivalName">Boss</span><svg viewBox="0 0 66 100" aria-hidden="true"><g class="body"><path class="limb front" d="m31 59-12 28-9 5" fill="none" stroke="#644052" stroke-width="9" stroke-linecap="round"/><path class="limb back" d="m35 59 13 28 9 5" fill="none" stroke="#644052" stroke-width="9" stroke-linecap="round"/><path class="limb front" d="m22 35-10 17 10 8" fill="none" stroke="#c79479" stroke-width="7" stroke-linecap="round"/><path class="limb back" d="m42 35 12 17 8-10" fill="none" stroke="#c79479" stroke-width="7" stroke-linecap="round"/><path d="M20 29h25l-4 35H25z" fill="currentColor"/><path d="m26 36 7 10 8-10" fill="none" stroke="#fff" stroke-width="3"/><circle cx="33" cy="17" r="13" fill="#c79479"/><path d="M18 12q15-17 30 0v7H18z" fill="#b43b42"/><circle cx="39" cy="20" r="2" fill="#30303e"/></g></svg></div></div>
<button class="big" id="click" aria-label="Click to gain speed">Train speed</button><div id="pet"></div><div id="petControls"><button id="equipPet" hidden>Unequip pet</button></div><div id="race" hidden><p id="raceLabel"></p>You <progress id="you" max="100" value="0"></progress><br>Boss <progress id="boss" max="100" value="0"></progress></div><div class="grid" id="bosses"></div></div><div class="row"><button id="upBtn">Upgrades</button><button id="petsBtn">Hatch an egg — $50</button><button id="worldBtn">Worlds</button><button id="save">Save game</button><button id="sound">Sound: off</button></div><div id="upgrades" class="panel grid" hidden></div><div id="worlds" class="panel grid" hidden></div></section><p class="message" id="msg" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id),key='speed-clicker-game004';const fresh=()=>({money:5000,clicks:0,wins:0,world:0,levels:[0,0,0],pet:0,petName:'No pet',petEquipped:true});let s=fresh(),running=false,sound=false,audio,trainingTimer;const worlds=[['Forest',0,'🌲 🐿️ 🌳',['Rabbit','Deer'],[20,100]],['Running Track',100,'🏟️ 🏁 🏃',['Sprinter','Champion','Track master'],[800,2500,8000]],['Deep Forest',250,'🌲 🐺 🌲',['Wolf','Bear','Forest giant'],[15000,40000,100000]],['Volcano',500,'🌋 🔥 🌋',['Lava lizard','Fire beast','Volcano dragon'],[150000,400000,1000000]],['The Void',1500,'🌌 👁️ 🌌',['Void stalker','Shadow titan','Void ruler'],[2000000,6000000,12000000]]];const petMult=()=>s.pet&&s.petEquipped!==false?2**s.pet:1,perClick=()=>Math.max(1,Math.ceil(1.9**s.levels[0]*petMult())),perSecond=()=>s.levels[1]?2**(s.levels[1]-1)*perClick():0;function say(t){$('msg').textContent=t}function beep(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=600;g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.05);o.start();o.stop(audio.currentTime+.05)}catch{}}
function save(){try{localStorage.setItem(key,JSON.stringify(s));return true}catch{say('Saving is unavailable in this frame.');return false}}
function render(){const w=worlds[s.world];$('stats').textContent=`Speed: ${Math.floor(s.clicks).toLocaleString()} • Money: $${Math.floor(s.money).toLocaleString()} • Wins: ${Math.floor(s.wins).toLocaleString()}`;$('clicks').textContent=`${Math.floor(s.clicks).toLocaleString()} clicks (+${perClick().toLocaleString()} per click)`;$('worldName').textContent=`World ${s.world+1}: ${w[0]} ${w[2]}`;$('pet').textContent=s.pet?`${s.petName}${s.petEquipped!==false?' · ×'+petMult()+' clicks, money and wins':' · unequipped'}`:'No pet — hatch an egg to find a companion.';$('equipPet').hidden=!s.pet;$('equipPet').textContent=s.petEquipped===false?'Equip pet':'Unequip pet';$('petFollower').hidden=!s.pet||s.petEquipped===false;$('petFollower').dataset.level=s.pet;$('petFollower').style.color=['','#e5d3b7','#dd8844','#8793ac','#e5ae55','#7cb77b'][s.pet]||'#e5d3b7';$('petFollower').setAttribute('aria-label',s.petName+' following you');$('scene').style.background=['#cfebc3','#e6d2b8','#97b694','#eaa790','#cabdec'][s.world];$('bosses').innerHTML='';w[3].forEach((name,i)=>{let b=document.createElement('button');b.textContent=`Race ${name} · Speed ${Math.ceil(w[4][i]*1.2).toLocaleString()}`;b.disabled=running;b.onclick=()=>race(i);$('bosses').append(b)});$('upgrades').innerHTML='';['Click power','Auto clicker','Money + win rate'].forEach((name,i)=>{let b=document.createElement('button'),cost=35*2**s.levels[i];b.textContent=`${name} · Level ${s.levels[i]}/20 · ${s.levels[i]>=20?'MAX':'$'+cost.toLocaleString()}`;b.disabled=s.levels[i]>=20;b.onclick=()=>{if(s.money<cost)return say('Not enough money.');s.money-=cost;s.levels[i]++;save();render()};$('upgrades').append(b)});$('worlds').innerHTML='';worlds.forEach((w,i)=>{const b=document.createElement('button');b.textContent=`World ${i+1}: ${w[0]} — ${w[1]} wins`;b.disabled=s.wins<w[1]||running;b.onclick=()=>{s.world=i;$('worlds').hidden=true;render();save()};$('worlds').append(b)})}
function positionRunners(player=0,boss=0){const x=18+Math.min(100,player)*.68;$('player').style.left=x+'%';$('petFollower').style.left=Math.max(7,x-10)+'%';$('rival').style.left=(18+Math.min(100,boss)*.68)+'%'}
function animateTraining(){if(running)return;clearTimeout(trainingTimer);$('player').classList.add('moving');positionRunners(22);trainingTimer=setTimeout(()=>{if(!running){positionRunners();$('player').classList.remove('moving')}},650)}
function race(i){if(running)return;running=true;clearTimeout(trainingTimer);$('race').hidden=false;$('rival').hidden=false;$('rival').classList.add('moving');$('player').classList.add('moving');positionRunners();$('you').value=0;$('boss').value=0;$('rivalName').textContent=worlds[s.world][3][i];let player=0,boss=0;const speed=Math.ceil(worlds[s.world][4][i]*1.2),distance=Math.max(speed,s.clicks,1)*2.4,world=s.world;$('raceLabel').textContent='Race in progress! Keep clicking — bosses sprint 15% faster in the final quarter.';render();const timer=setInterval(()=>{player+=s.clicks/10;boss+=speed/10*(boss/distance>=.75?1.15:1);$('you').value=Math.min(100,player/distance*100);$('boss').value=Math.min(100,boss/distance*100);positionRunners(player/distance*100,boss/distance*100);if(player>=distance||boss>=distance){clearInterval(timer);running=false;$('player').classList.remove('moving');$('rival').classList.remove('moving');if(player>=distance&&player>=boss){const reward=(i+1)*Math.max(1,10**world)*2**s.levels[2]*petMult();s.wins+=reward;s.money+=25*reward;say(`You won! +${reward} wins, +$${25*reward}. Back at the spawn point.`)}else say('The boss won. Gain more speed and try again.');save();render();setTimeout(()=>{if(!running){positionRunners();$('rival').hidden=true}},1000)}},100)}
function start(){$('menu').hidden=true;$('game').hidden=false;render()}
$('play').onclick=start;$('new').onclick=()=>{if(running)return;s=fresh();save();start()};$('continue').onclick=()=>{try{const old=JSON.parse(localStorage.getItem(key));if(old&&Array.isArray(old.levels))s=old;else say('No saved game. Starting fresh.')}catch{say('No saved game available.')}start()};$('worldMenu').onclick=()=>{start();$('worlds').hidden=false};$('click').onclick=()=>{s.clicks+=perClick();animateTraining();beep();render()};$('upBtn').onclick=()=>$('upgrades').hidden=!$('upgrades').hidden;$('worldBtn').onclick=()=>$('worlds').hidden=!$('worlds').hidden;$('save').onclick=()=>{if(save())say('Game saved.')};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Sound: '+(sound?'on':'off');beep()};$('equipPet').onclick=()=>{if(!s.pet)return;s.petEquipped=s.petEquipped===false;save();render()};$('petsBtn').onclick=()=>{if(s.money<50)return say('You need $50.');s.money-=50;const r=Math.random()*100,level=r<1?5:r<11?4:r<35?3:r<70?2:1,names=['','Common rabbit','Rare fox','Epic wolf','Legendary lion','Mythic dragon'];if(level>s.pet){s.pet=level;s.petName=names[level]}say(`Hatched ${names[level]}! ${s.petEquipped===false?'Your strongest pet is available to equip.':'Your strongest pet stays equipped.'}`);save();render()};setInterval(()=>{if(!$('game').hidden){s.clicks+=perSecond();render()}},1000);setInterval(()=>{if(!$('game').hidden)save()},10000);setTimeout(()=>{$('loading').hidden=true;$('menu').hidden=false},600);
</script></html>
