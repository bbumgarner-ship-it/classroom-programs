<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speed Clicker</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui;color:#203225;background:#e8f2df}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px}button,select{font:inherit;padding:12px;border:1px solid #8caa7c;border-radius:9px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.97)}.row{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:18px;background:#ffffffd9;border-radius:14px;margin:16px 0}.stats{font-weight:bold;font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:110px;min-width:210px;min-height:200px;background:#fff7cc}.message{min-height:28px}small{font-size:13px} [hidden]{display:none!important}progress{width:min(65vw,500px);height:24px}#scene{text-align:center}#bosses{margin-top:16px}</style><main><h1>Speed Clicker</h1><div id="loading" class="panel">Loading the race tracks…</div><div id="menu" class="panel" hidden><p>Click to gain speed. Race bosses, hatch pets, and unlock five worlds.</p><div class="row"><button id="play">Play</button><button id="continue">Continue game</button><button id="new">New game</button><button id="worldMenu">Worlds</button></div></div><section id="game" hidden><div class="panel stats" id="stats"></div><div class="panel" id="scene"><h2 id="worldName"></h2><div id="clicks"></div><button class="big" id="click" aria-label="Click to gain speed">👟</button><div id="pet"></div><div id="race" hidden><p id="raceLabel"></p>You <progress id="you" max="100" value="0"></progress><br>Boss <progress id="boss" max="100" value="0"></progress></div><div class="grid" id="bosses"></div></div><div class="row"><button id="upBtn">Upgrades</button><button id="petsBtn">Hatch an egg — $50</button><button id="worldBtn">Worlds</button><button id="save">Save game</button><button id="sound">Sound: off</button></div><div id="upgrades" class="panel grid" hidden></div><div id="worlds" class="panel grid" hidden></div></section><p class="message" id="msg" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id),key='speed-clicker-game004';const fresh=()=>({money:5000,clicks:0,wins:0,world:0,levels:[0,0,0],pet:0,petName:'No pet'});let s=fresh(),running=false,sound=false,audio;const worlds=[['Forest',0,'🌲 🐿️ 🌳',['Rabbit','Deer'],[20,100]],['Running Track',100,'🏟️ 🏁 🏃',['Sprinter','Champion','Track master'],[800,2500,8000]],['Deep Forest',250,'🌲 🐺 🌲',['Wolf','Bear','Forest giant'],[15000,40000,100000]],['Volcano',500,'🌋 🔥 🌋',['Lava lizard','Fire beast','Volcano dragon'],[150000,400000,1000000]],['The Void',1500,'🌌 👁️ 🌌',['Void stalker','Shadow titan','Void ruler'],[2000000,6000000,12000000]]];const petMult=()=>s.pet?2**s.pet:1,perClick=()=>2**s.levels[0]*petMult(),perSecond=()=>s.levels[1]?2**(s.levels[1]-1)*perClick():0;function say(t){$('msg').textContent=t}function beep(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=600;g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.05);o.start();o.stop(audio.currentTime+.05)}catch{}}
function save(){try{localStorage.setItem(key,JSON.stringify(s));return true}catch{say('Saving is unavailable in this frame.');return false}}
function render(){const w=worlds[s.world];$('stats').textContent=`Speed: ${Math.floor(s.clicks).toLocaleString()} • Money: $${Math.floor(s.money).toLocaleString()} • Wins: ${Math.floor(s.wins).toLocaleString()}`;$('clicks').textContent=`${Math.floor(s.clicks).toLocaleString()} clicks (+${perClick().toLocaleString()} per click)`;$('worldName').textContent=`World ${s.world+1}: ${w[0]} ${w[2]}`;$('pet').textContent=`${s.petName}${s.pet?' · ×'+petMult()+' clicks, money and wins':''}`;$('scene').style.background=['#cfebc3','#e6d2b8','#97b694','#eaa790','#cabdec'][s.world];$('bosses').innerHTML='';w[3].forEach((name,i)=>{let b=document.createElement('button');b.textContent=`Race ${name} · Speed ${w[4][i].toLocaleString()}`;b.disabled=running;b.onclick=()=>race(i);$('bosses').append(b)});$('upgrades').innerHTML='';['Click power','Auto clicker','Money + win rate'].forEach((name,i)=>{let b=document.createElement('button'),cost=25*2**s.levels[i];b.textContent=`${name} · Level ${s.levels[i]}/20 · ${s.levels[i]>=20?'MAX':'$'+cost.toLocaleString()}`;b.disabled=s.levels[i]>=20;b.onclick=()=>{if(s.money<cost)return say('Not enough money.');s.money-=cost;s.levels[i]++;save();render()};$('upgrades').append(b)});$('worlds').innerHTML='';worlds.forEach((w,i)=>{const b=document.createElement('button');b.textContent=`World ${i+1}: ${w[0]} — ${w[1]} wins`;b.disabled=s.wins<w[1]||running;b.onclick=()=>{s.world=i;$('worlds').hidden=true;render();save()};$('worlds').append(b)})}
function race(i){if(running)return;running=true;$('race').hidden=false;let player=0,boss=0;const speed=worlds[s.world][4][i],distance=Math.max(speed,s.clicks,1)*3,world=s.world;$('raceLabel').textContent='Race in progress! Keep clicking for speed.';render();const timer=setInterval(()=>{player+=s.clicks/10;boss+=speed/10;$('you').value=Math.min(100,player/distance*100);$('boss').value=Math.min(100,boss/distance*100);if(player>=distance||boss>=distance){clearInterval(timer);running=false;if(player>=distance&&player>=boss){const reward=(i+1)*Math.max(1,10**world)*2**s.levels[2]*petMult();s.wins+=reward;s.money+=25*reward;say(`You won! +${reward} wins, +$${25*reward}. Back at the spawn point.`)}else say('The boss won. Gain more speed and try again.');save();render()}},100)}
function start(){$('menu').hidden=true;$('game').hidden=false;render()}
$('play').onclick=start;$('new').onclick=()=>{if(running)return;s=fresh();save();start()};$('continue').onclick=()=>{try{const old=JSON.parse(localStorage.getItem(key));if(old&&Array.isArray(old.levels))s=old;else say('No saved game. Starting fresh.')}catch{say('No saved game available.')}start()};$('worldMenu').onclick=()=>{start();$('worlds').hidden=false};$('click').onclick=()=>{s.clicks+=perClick();beep();render()};$('upBtn').onclick=()=>$('upgrades').hidden=!$('upgrades').hidden;$('worldBtn').onclick=()=>$('worlds').hidden=!$('worlds').hidden;$('save').onclick=()=>{if(save())say('Game saved.')};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Sound: '+(sound?'on':'off');beep()};$('petsBtn').onclick=()=>{if(s.money<50)return say('You need $50.');s.money-=50;const r=Math.random()*100,level=r<1?5:r<11?4:r<35?3:r<70?2:1,names=['','Common rabbit','Rare fox','Epic wolf','Legendary lion','Mythic dragon'];if(level>s.pet){s.pet=level;s.petName=names[level]}say(`Hatched ${names[level]}! Your strongest pet stays equipped.`);save();render()};setInterval(()=>{if(!$('game').hidden){s.clicks+=perSecond();render()}},1000);setInterval(()=>{if(!$('game').hidden)save()},10000);setTimeout(()=>{$('loading').hidden=true;$('menu').hidden=false},600);
</script></html>
