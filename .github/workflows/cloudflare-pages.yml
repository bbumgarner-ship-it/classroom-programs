name: Publish classroom arcade to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-programs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate catalog and prepare complete site
        run: node scripts/prepare-site.mjs
      - name: Deploy to the existing Cloudflare site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '635cb842cccbb3f4a6f839d2dfe5d1b0'
          command: pages deploy dist --project-name=classroom-programs --branch=main
