<script>
'use strict';
const C={"title": "Story Mode Coderot Phighting", "subtitle": "Come on, phighter gears!", "mode": "coderot", "bg": "#1b2037", "accent": "#78dcd0", "currency": "Points", "money": 160, "health": 300, "kill": 20, "path": [], "towers": [["Sword", 20, 18, 180, 0.8], ["Skateboard", 20, 12, 210, 0.55], ["Biograft", 20, 10, 190, 0.4], ["Katana", 20, 30, 220, 1.2], ["Ban Hammer", 20, 42, 200, 1.8], ["Coil", 20, 12, 230, 0.7], ["Rocket", 20, 28, 420, 1.7], ["Slingshot", 20, 12, 390, 0.6], ["Hyperlaser", 20, 48, 610, 2.2], ["Shuriken", 20, 10, 360, 0.45], ["Scythe", 20, 25, 340, 1.1], ["Medkit", 20, 6, 290, 1], ["Boombox", 20, 5, 290, 1], ["Subspace", 20, 12, 320, 1.2], ["Vine Staff", 20, 8, 310, 0.9]], "help": "All 15 phighters cost 20 points. Melee, ranged and support attacks can reach nearby lanes. Medkit and Vine Staff heal allies, Boombox slows enemies, and Coil supports nearby allies. Pick a themed map before battle. Click falling Broker coins to buy character skins. Every defeated coderot has a 50% chance to drop a powerup. Click powerups for healing, points or a temporary damage boost. Confirm placements with Yes or No. Fallen phighters still become infected."},mode=C.mode,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=900,H=540;
const brokerImage=new Image();brokerImage.src='td18-broker-coin-nov9.png';
const FACTIONS=["Factionless", "Factionless", "Korblox Administration", "Darkage Clan", "The Heights / Factionless", "Support/Melee hybrid aspects", "Factionless", "Factionless", "Korblox Administration", "Factionless", "The Church of the TRUE EYE", "The Church of the TRUE EYE", "Factionless", "Korblox Administration", "Factionless"];
const MAPS=[["Crossroads","#506b87","#243c53"],["Blackrock Lab","#554b73","#231c3d"],["Doomspire","#596245","#202e24"],["Neon Heights","#764765","#241d38"]];
const laneMode=['chimps','coderot'].includes(mode), grid={x:120,y:60,w:650,h:430,cols:8,rows:5};
let state, selectedType=0, selectedId=null, hover=null, dragging=false, pending=null, speed=1, sound=false,audio=null,frameTime=0,lastMusic=0,modal=true,previousPause=false,selectionCursor={col:0,row:0},hiddenClicks=0;
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const path=C.path,segments=[];let pathLength=0;
for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segments.push({a,b,l,start:pathLength});pathLength+=l;}
function pointAt(d){for(const s of segments)if(d<=s.start+s.l){let t=clamp((d-s.start)/s.l,0,1);return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,angle:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};}let p=path.at(-1)||[0,0];return{x:p[0],y:p[1],angle:0};}
function pathDistance(x,y){let best=1e9;for(const s of segments){let dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],t=clamp(((x-s.a[0])*dx+(y-s.a[1])*dy)/(s.l*s.l),0,1);best=Math.min(best,Math.hypot(x-s.a[0]-t*dx,y-s.a[1]-t*dy));}return best;}
function fresh(){cancelPlacement();state={money:C.money,hp:C.health,maxHp:C.health,towers:[],enemies:[],effects:[],wave:0,level:1,subwave:0,score:0,time:0,levelTime:0,running:false,paused:false,over:false,won:false,queue:[],spawnTimer:0,breakTime:0,uid:0,freeUsed:false,checkpoint:null,cleaned:0,junked:0,carCount:0,rain:false,baseLevel:1,story:1,broker:0,pickups:[],skins:[],equipped:[],map:0,boost:0};selectedId=null;selectedType=0;speed=1;$('mapChoice').value='0';$('speed').textContent='Speed ×1';$('pause').textContent='Pause';if(mode==='cars'){addTower(0,220,120,false);state.freeUsed=true;}checkpoint();updateUI();}
function snapshot(){return JSON.parse(JSON.stringify(state,(k,v)=>['effects','checkpoint'].includes(k)?undefined:v));}
function checkpoint(){state.checkpoint=snapshot();}
function notice(t){$('notice').textContent=t;}
function tone(freq=440,duration=.1,type='sine',vol=.045){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){sound=false;}}
function showDialog(html){previousPause=state?.paused||false;modal=true;$('overlay').classList.remove('hidden');$('dialog').innerHTML=html;}
function closeDialog(){modal=false;$('overlay').classList.add('hidden');}
function titleScreen(){showDialog(`<h2>${C.title}</h2><p>${C.subtitle}</p><p>${mode==='coderot'?'Coderot is approaching the tower. The phighter gears are your last line of defense.':C.help}</p><button id="play">${mode==='coderot'?'Start story':'Play'}</button><button id="titleSettings">Settings</button><button id="credits">Credits</button>`);$('play').onclick=()=>{if(mode==='coderot'){showDialog('<h2>Gears, get ready!</h2><p>A tiny rocket leads the way to the tower.</p><svg width="80" height="35" viewBox="0 0 80 35"><path fill="#e75d5d" d="M55 17L20 5v24z"/><path fill="#76dcd0" d="M20 10H5v14h15z"/><circle cx="36" cy="17" r="5" fill="white"/></svg><div class="loading"><i></i></div>');setTimeout(()=>{closeDialog();notice('Come on phighter gears! Place your first defense, then start the wave.');},1000);}else closeDialog();};if(mode==='coderot'){try{let saved=localStorage.getItem('coderot-checkpoint');if(saved){let b=document.createElement('button');b.textContent='Resume saved story';$('dialog').appendChild(b);b.onclick=()=>{try{importCode(saved);closeDialog();notice('Saved story restored.');}catch(e){notice('That browser save cannot be restored.');}};}}catch(e){}}$('titleSettings').onclick=settings;$('credits').onclick=()=>{showDialog('<h2>Credits</h2><p>A classroom game design, implemented as a standalone browser game. All illustrated game art and synthesized sound effects are included in this file.</p><button id="back">Back</button>');$('back').onclick=titleScreen;};}
function settings(){showDialog(`<h2>Settings</h2><p>Sound is optional. All gameplay has visible feedback.</p><label><input id="soundOpt" type="checkbox" ${sound?'checked':''}> ${mode==='shoes'?'Original beat and sound effects':'Synthesized sound effects'}</label><button id="done">Return to game</button>`);$('soundOpt').onchange=e=>{sound=e.target.checked;tone();};$('done').onclick=closeDialog;}
function towerCost(i){if(!state.freeUsed&&((['chimps','bread'].includes(mode)&&i===0)||mode==='shoes'))return 0;return C.towers[i][1];}
function addTower(type,x,y,charge=true){let def=C.towers[type],cost=towerCost(type);if(charge&&state.money<cost){notice('Not enough funds.');tone(140,.2);return false;}if(charge)state.money-=cost;state.freeUsed=true;let t={id:++state.uid,type,x,y,row:Math.floor((y-grid.y)/(grid.h/5)),level:1,hp:mode==='chimps'?35:mode==='coderot'?110:80,maxHp:mode==='chimps'?35:mode==='coderot'?110:80,cooldown:0};state.towers.push(t);selectedId=t.id;selectedType=null;pending=null;tone(mode==='cars'?620:440,.12);updateUI();if(mode==='cars'&&state.money<=0)end(false,'Out of money. The wash shop is bankrupt.');return true;}
function cancelPlacement(){pending=null;$('placeConfirm').classList.add('hidden');}
function validPlace(p){if(laneMode)return p.x>=grid.x&&p.x<grid.x+grid.w&&p.y>=grid.y&&p.y<grid.y+grid.h&&!state.towers.some(t=>Math.abs(t.x-p.x)<30&&Math.abs(t.y-p.y)<30);return p.x>35&&p.x<840&&p.y>40&&p.y<500&&pathDistance(p.x,p.y)>43&&!state.towers.some(t=>dist(t,p)<55);}
function snap(p){if(!laneMode)return p;let c=clamp(Math.floor((p.x-grid.x)/(grid.w/8)),0,7),r=clamp(Math.floor((p.y-grid.y)/(grid.h/5)),0,4);return{x:grid.x+(c+.5)*grid.w/8,y:grid.y+(r+.5)*grid.h/5};}
function place(p){if(state.over||modal)return;let target=state.towers.find(t=>dist(t,p)<30);if(target){selectedId=target.id;selectedType=null;updateUI();return;}if(selectedType===null){notice('Choose a defender from the shop first.');return;}if(laneMode&&(p.x<grid.x||p.x>grid.x+grid.w||p.y<grid.y||p.y>grid.y+grid.h)){notice('Place defenders on a grass square.');return;}p=snap(p);if(!validPlace(p)){notice(laneMode?'That square is occupied.':'Choose an empty place away from the lane.');tone(170,.13);return;}if(mode==='coderot'){pending={type:selectedType,...p};$('placeConfirm').classList.remove('hidden');$('placeTitle').textContent=`Place ${C.towers[selectedType][0]} · ${towerCost(selectedType)} points?`;$('placeText').textContent='The outlined preview marks your chosen square. Combat continues while you decide.';$('yes').onclick=()=>{if(!pending||state.over){cancelPlacement();return;}let choice={...pending};if(addTower(choice.type,choice.x,choice.y))cancelPlacement();else $('placeText').textContent='Not enough funds. Choose No to move it or earn more points.';};$('no').onclick=()=>{cancelPlacement();notice('Placement cancelled. Choose another square.');};}else addTower(selectedType,p.x,p.y);}
function upgradeCost(t){return mode==='chimps'?4*t.level:mode==='bread'?60*t.level:mode==='shoes'?3*t.level:mode==='cars'?100*t.level:35*t.level;}
function upgrade(){let t=state.towers.find(t=>t.id===selectedId);if(!t||state.over)return;let cost=upgradeCost(t);if(state.money<cost){notice('Not enough funds.');tone(130,.18);return;}if(mode!=='shoes'&&t.level>=5){notice('Maximum upgrade reached.');return;}state.money-=cost;t.level++;t.maxHp+=20;t.hp=t.maxHp;tone(740,.2);notice(`${C.towers[t.type][0]} upgraded to level ${t.level}.`);updateUI();if(mode==='cars'&&state.money<=0)end(false,'Out of money. The wash shop is bankrupt.');}
function makeEnemy(i,boss=false){let row=i%5,p=laneMode?{x:940+i%2*25,y:grid.y+(row+.5)*grid.h/5}:pointAt(0);let hp=mode==='bread'?120+(boss?480:0):mode==='shoes'?(boss?20+state.wave*2:1):mode==='cars'?55+(state.wave-1)*5+(i%6)*10:mode==='chimps'?(boss?70+state.level*10:7+state.level*1.7+state.subwave*.6):26+state.wave*5+(boss?65:0);let e={id:++state.uid,...p,row,d:0,hp,maxHp:hp,speed:mode==='bread'?22:mode==='shoes'?42+Math.min(60,state.wave*2):mode==='cars'?35:mode==='chimps'?12+Math.min(15,state.level*.2):12+Math.min(12,state.wave*.6),type:i%6,boss,slow:0,hit:0,attack:0,clean:false,infected:false};return e;}
function nextWave(){if(state.over||modal)return;if(mode!=='bread'&&mode!=='cars'&&state.running)return;if(mode!=='cars'&&!state.towers.some(t=>!(mode==='bread'&&t.type===2))){notice('Place a defender first. Your starter can be free.');return;}if(!state.running&&(mode!=='chimps'||state.subwave===0))checkpoint();state.running=true;state.breakTime=0;state.wave++;state.rain=mode==='shoes'&&state.wave%4===0;if(mode==='chimps')state.subwave++;let count=mode==='cars'?4:mode==='bread'?Math.min(100,3+state.wave):mode==='shoes'?6+state.wave*2:mode==='chimps'?5+Math.min(20,state.level)+Math.floor(state.subwave/2):3+state.wave;let start=state.queue.length;for(let i=0;i<count;i++)state.queue.push(makeEnemy(start+i,false));if((mode==='shoes'||mode==='bread')&&state.wave%5===0)state.queue.push(makeEnemy(0,true));if(mode==='chimps'&&state.level%10===0&&state.subwave===10)state.queue.push(makeEnemy(2,true));if(mode==='coderot'&&state.wave%5===0)state.queue.push(makeEnemy(2,true));state.spawnTimer=0;tone(590,.12);notice(state.rain?'Purple rain! All KO earnings are doubled.':mode==='cars'?'Cars released. Clean them before they reach the garage.':`Wave ${state.wave} begins.`);updateUI();}
function end(win,reason){cancelPlacement();state.over=true;state.running=false;state.won=win;tone(win?880:90,.6);showDialog(`<h2>${win?'You win!':mode==='coderot'?'The tower is infected':'Defense failed'}</h2><p>${reason}</p><p>${mode==='cars'?`Cleaned ${state.cleaned} cars; ${state.junked} to the junkyard.`:`Score: ${state.score}. Wave ${state.wave}.`}</p><button id="again">${mode==='chimps'?'Retry this level':'Try again'}</button>`);if(mode==='coderot')$('dialog').style.boxShadow=win?'0 0 70px #ffdf5570':'0 0 70px #ff303070';$('again').onclick=()=>{if(mode==='chimps')retry();else{fresh();closeDialog();}};}
function retry(){cancelPlacement();if(state.checkpoint){let cp=JSON.parse(JSON.stringify(state.checkpoint));state={broker:0,pickups:[],skins:[],equipped:[],map:0,boost:0,...cp,effects:[],checkpoint:cp,over:false,paused:false,running:false,queue:[],enemies:[],breakTime:0};if(mode==='chimps'){state.subwave=0;state.wave=(state.level-1)*10;state.levelTime=0;}selectedId=null;$('pause').textContent='Pause';closeDialog();updateUI();notice('Restarted from the beginning of this round.');}else{fresh();closeDialog();}}
function roundEnd(){state.running=false;if(mode==='bread'){for(const t of state.towers)if(t.type===2)state.money=Math.min(5e10,state.money+20*t.level);if(state.wave===1000)notice('1,000 waves defended! You win. Continue for endless play.');else notice('Wave complete. Bread trees have paid out.');}else if(mode==='chimps'){if(state.subwave>=10){if(state.level===100){end(true,'All five stories complete. The forest is safe.');return;}state.level++;state.story=Math.ceil(state.level/20);state.subwave=0;state.levelTime=0;checkpoint();notice(`Level complete. Story ${state.story}, level ${state.level} is ready.`);}else notice('Wave cleared. Place and upgrade before continuing.');}else if(mode==='coderot'){state.breakTime=12;notice('Wave cleared! Twelve seconds to shop and collect drops.');}else notice(mode==='cars'?'All cars processed. Send the next group when ready.':'Shoes cleared. Upgrade or start the next wave.');updateUI();}
function reward(e){if(Math.random()<.28)state.pickups.push({kind:'coin',x:e.x,y:e.y,life:16});if(Math.random()<.5)state.pickups.push({kind:['heal','boost','points'][Math.floor(Math.random()*3)],x:e.x+22,y:e.y+20,life:16});if(mode==='coderot')state.effects.push({kind:'burst',x:e.x,y:e.y,color:'#8ce9d1',life:.55});let amount=mode==='shoes'?Math.floor(rnd(5,8))*(state.rain?2:1):C.kill;state.money=Math.min(mode==='bread'?5e10:1e12,state.money+amount);state.score++;state.effects.push({kind:'text',x:e.x,y:e.y,text:`+${amount}`,life:.7});tone(mode==='shoes'?660:520,.035,'triangle',.014);}
function tick(dt){if(!state||modal||state.paused||state.over)return;state.time+=dt;state.boost=Math.max(0,state.boost-dt);for(let d of state.pickups){d.life-=dt;d.y=Math.min(505,d.y+dt*12)}state.pickups=state.pickups.filter(d=>d.life>0);for(let t of state.towers){if([5,11,14].includes(t.type))for(let ally of state.towers)if(dist(t,ally)<220)ally.hp=Math.min(ally.maxHp,ally.hp+dt*(t.type===11?4:2));if(t.type===12)for(let e of state.enemies)if(dist(t,e)<220)e.slow=.2;}
if(mode==='shoes'&&sound&&state.time-lastMusic>.32){lastMusic=state.time;let notes=[110,165,130.81,196,110,146.83,130.81,164.81];tone(notes[Math.floor(state.time/.32)%notes.length],.2,'triangle',.025);}if(mode==='chimps'&&state.running){state.levelTime+=dt;if(state.levelTime>=300){end(false,'Five minutes elapsed. Retry this level.');return;}}if(state.breakTime>0){state.breakTime-=dt;if(state.breakTime<=0)nextWave();}if(state.running&&state.queue.length){state.spawnTimer-=dt;if(state.spawnTimer<=0&&state.enemies.length<100){let e=state.queue.shift();state.enemies.push(e);if(mode==='cars')tone(90,.22,'sawtooth',.012);if(mode==='bread')tone(130,.06,'triangle',.015);if(mode==='chimps')tone(110,.18,'sawtooth',.009);state.spawnTimer=mode==='cars'?.65:mode==='bread'?1.8:mode==='shoes'?.7:1.2;}}
for(const t of state.towers){t.cooldown-=dt;let def=C.towers[t.type];if(!def[2]||t.cooldown>0)continue;let range=def[3]+(t.level-1)*(mode==='shoes'?8:16),targets=state.enemies.filter(e=>e.hp>0&&!e.clean&&(!laneMode||mode==='coderot'||e.row===t.row)&&dist(t,e)<range).sort((a,b)=>laneMode?a.x-b.x:b.d-a.d);if(!targets.length)continue;let e=targets[0];t.cooldown=Math.max(.12,def[4]/(1+(t.level-1)*.18));let dmg=def[2]*(1+(t.level-1)*.7)*(state.boost>0?1.6:1);if(mode==='cars')tone(1700,.055,'sawtooth',.006);e.hp-=dmg;e.hit=.12;if(mode==='coderot')state.effects.push({kind:'damage',x:e.x,y:e.y-24,text:'−'+Math.round(dmg),life:.7});if(mode==='shoes'&&t.type===1)e.slow=2.3;if(mode==='shoes'&&t.type===2)e.slow=2;if((mode==='chimps'&&t.type===2)||(mode==='coderot'&&t.type===6)){for(let other of targets.slice(1))if(dist(e,other)<65)other.hp-=dmg*.6;}
state.effects.push({kind:mode==='cars'?'water':'shot',x:t.x,y:t.y,tx:e.x,ty:e.y,color:mode==='cars'?'#92eaff':mode==='bread'?'#d8ffff':mode==='shoes'?(t.type===2?'#9ce86b':t.type===1?'#ce87ff':'#eab361'):mode==='coderot'?'#89e9d8':'#bda274',life:.2,type:t.type});if(mode==='cars'&&e.hp<=0){e.clean=true;e.hp=0;tone(900,.09,'sine',.018);} }
for(const e of state.enemies){e.hit-=dt;e.slow=Math.max(0,e.slow-dt);if(e.hp<=0&&mode!=='cars'){if(!e.dead){e.dead=true;reward(e);}continue;}let blocked=null;if(laneMode)blocked=state.towers.filter(t=>t.row===e.row&&e.x>=t.x-10&&e.x-t.x<38).sort((a,b)=>b.x-a.x)[0];if(blocked){e.attack-=dt;if(e.attack<=0){blocked.hp-=mode==='chimps'?(e.boss?15:7):(e.boss?14:6);e.attack=1;state.effects.push({kind:'ring',x:blocked.x,y:blocked.y,color:'#ed6555',life:.25});}}else if(laneMode)e.x-=e.speed*dt*(e.slow?.25:1);else{e.d+=e.speed*dt*(e.slow?.25:1);Object.assign(e,pointAt(e.d));}if(mode==='shoes'&&e.boss){e.attack-=dt;if(e.attack<=0&&state.towers.length){let t=state.towers.reduce((a,b)=>dist(a,e)<dist(b,e)?a:b);t.hp-=12;e.attack=2;state.effects.push({kind:'shot',x:e.x,y:e.y,tx:t.x,ty:t.y,color:'#92e099',life:.5,type:4});}}

let fallen=state.towers.filter(t=>t.hp<=0);for(const t of fallen)if(mode==='coderot'){let e=makeEnemy(t.row);e.x=t.x;e.y=t.y;e.row=t.row;e.hp=40;e.maxHp=40;e.infected=true;e.type=t.type;state.enemies.push(e);state.effects.push({kind:'infection',x:t.x,y:t.y,life:1.4});tone(120,.4,'sawtooth',.035);notice(`INFECTION: ${C.towers[t.type][0]} in lane ${t.row+1} has turned!`);}state.towers=state.towers.filter(t=>t.hp>0);if(fallen.length&&mode==='coderot'&&!state.towers.length){end(false,'All phighters fell to coderot.');return;}if(mode==='chimps'&&!state.towers.length){state.freeUsed=false;}
