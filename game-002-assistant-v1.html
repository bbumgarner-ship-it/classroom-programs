<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bread Clicker 1.0</title><style>body{margin:0;background:repeating-linear-gradient(0deg,#a76d40 0 55px,#8b552e 55px 59px);font:20px system-ui;color:#382410;text-align:center}header{padding:20px;background:#ffe7b9}h1{margin:0}.kitchen{height:60px;background:repeating-linear-gradient(90deg,#f6e8c8 0 100px,#ab9976 100px 104px);border-bottom:8px solid #694a31}main{display:flex;align-items:center;justify-content:space-around;gap:20px;min-height:350px;padding:25px;flex-wrap:wrap}#bread{width:240px;height:270px;border:20px solid #a9642c;border-radius:85px 85px 30px 30px;background:#fff6d6;position:relative;cursor:pointer;box-shadow:8px 10px #50351a44}#bread:active{transform:scale(.96)}.hole{position:absolute;width:15px;height:11px;background:#d2b97e;border-radius:50%}#shop{background:#fff0cf;padding:15px;max-width:290px;border:3px solid #513c27}#money{background:#fff0cf;padding:20px;font-size:28px}button{font:inherit;cursor:pointer;border:2px solid #604124;border-radius:8px;background:#fff0cf;padding:10px;margin:6px}#shop button{display:block;width:100%}#bots{font-size:18px;padding:20px}footer{background:#ffe7b9;padding:12px}#loading{position:fixed;inset:0;background:#e8ce9b;display:grid;place-content:center;font-size:35px}#loading[hidden]{display:none}</style><header><h1>Bread Clicker 1.0</h1><p>Click the bread and buy upgrades.</p></header><div class="kitchen"></div><main><aside id="shop" hidden><h2>Upgrade shop</h2><div id="items"></div></aside><button id="bread" aria-label="Click bread"><span class="hole" style="left:20%;top:20%"></span><span class="hole" style="left:65%;top:30%"></span><span class="hole" style="left:40%;top:70%"></span><span class="hole" style="left:75%;top:65%"></span><span class="hole" style="left:25%;top:45%"></span></button><aside id="money"></aside></main><div id="bots"></div><footer><div id="stats"></div><p id="message"></p><button id="music">Music: off</button><button id="reset">Restart</button><small>Progress saves on this device. No offline earnings.</small></footer><div id="loading">Loading bread…</div><script>
const $=x=>document.getElementById(x),key='bread-clicker-one';let s={bread:0,clicks:0,roundClicks:0,level:0,stage:0},music=false,ac,beat=0;try{Object.assign(s,JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){}const names=['More bread','Even more bread','Bread maker','New bread'],costs=[25,100,450,1000];function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function rate(){return s.level>=3?10:s.level===2?5:s.level===1?2:0}function draw(){$('shop').hidden=s.roundClicks<25;$('money').textContent=Math.floor(s.bread).toLocaleString()+' bread';$('stats').textContent='Clicks: '+s.clicks.toLocaleString()+' · '+rate()+' bread/second · Bread stage '+(s.stage+1);$('bots').textContent=s.level>=3?'[ BREAD BOT ]  [ BREAD BOT ]  Making bread while you wait.':'';$('bread').style.background=s.stage>=3?'#fff':s.roundClicks>400?'#b6c59a':'#fff6d6';$('bread').style.height=Math.max(140,270-s.roundClicks/10)+'px';$('bread').style.width=Math.max(145,240-s.roundClicks/15)+'px';$('bread').querySelectorAll('.hole').forEach((h,i)=>h.style.background=s.roundClicks>100+i*80?'#65774b':'#d2b97e');$('items').replaceChildren();if(s.level<4){let b=document.createElement('button');b.textContent=names[s.level]+' — '+costs[s.level]+' bread';b.disabled=s.roundClicks<costs[s.level]||s.bread<costs[s.level];b.onclick=()=>{let c=costs[s.level];if(s.bread<c||s.roundClicks<c)return;s.bread-=c;s.level++;if(s.level===4){s.stage++;s.roundClicks=0;s.level=0;$('message').textContent=s.stage>=3?'Sugar bread! You win. You can keep playing.':'New moldy bread. Start the upgrade cycle again.'}draw();save()};$('items').append(b)}}function sound(f,d){if(!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}$('bread').onclick=()=>{s.clicks++;s.roundClicks++;s.bread=Math.min(1e7,s.bread+2);if(music)sound(130,.07);draw();save()};$('music').onclick=()=>{music=!music;if(music)ac=ac||new(window.AudioContext||window.webkitAudioContext)();$('music').textContent='Music: '+(music?'on':'off')};function reset(){s={bread:0,clicks:0,roundClicks:0,level:0,stage:0};$('message').textContent='New loaf.';save();draw()}$('reset').onclick=reset;document.addEventListener('keydown',e=>{if(e.altKey&&e.key.toLowerCase()==='f'){e.preventDefault();reset()}});setInterval(()=>{s.bread=Math.min(1e7,s.bread+rate());if(music)sound([262,330,392,330,440,392,330,294][beat++%8],.15);draw();save()},1000);draw();setTimeout(()=>$('loading').hidden=true,600);
</script></html>
