<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helmet Clicker</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui;color:#203225;background:#e8f2df}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px}button,select{font:inherit;padding:12px;border:1px solid #8caa7c;border-radius:9px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.97)}.row{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:18px;background:#ffffffd9;border-radius:14px;margin:16px 0}.stats{font-weight:bold;font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:110px;min-width:210px;min-height:200px;background:#fff7cc}.message{min-height:28px}small{font-size:13px} [hidden]{display:none!important}#helmet{border:0;background:transparent;touch-action:manipulation}#drawer{animation:slide .2s ease-out}progress{display:block;width:100%;margin-top:10px}@keyframes slide{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}</style><main><h1>Helmet Clicker</h1><p>Click your helmet. Buy upgrades, new helmets and accessories.</p><div class="panel stats" id="stats"></div><div class="row"><section class="panel" style="flex:1;text-align:center"><h2 id="helmetName"></h2><button id="helmet" aria-label="Click the helmet"><svg viewBox="0 0 300 260" width="260" height="240" aria-hidden="true"><path id="shell" fill="#b73536" stroke="#263744" stroke-width="6" d="M44 157C18 40 97 12 160 30c75 20 96 88 81 142l-59 25-27-52-46 12-11 40-39-14Z"/><path fill="#182633" d="m162 100 83 10-9 51-59 5Z"/><path id="visor" fill="#56bdd4" opacity=".45" d="m169 105 70 10-8 32-53 8Z"/><path id="mask" fill="none" stroke="#ddd" stroke-width="10" stroke-linejoin="round" d="m183 135 80 9 17 70-94 10-30-70m25 37 93-5m-50-40 7 70"/><path id="strap" stroke="#eee" stroke-width="9" fill="none" d="m100 170 25 66 55-12"/><text id="sticker" x="90" y="90" font-size="36"></text><circle cx="126" cy="134" r="12" fill="#ddd"/><path id="mouth" d="m190 223 35 4-3 12-30-4Z" fill="none"/></svg></button><p id="itemCount"></p><div id="challenge" class="panel" hidden><h3 id="challengeName"></h3><p id="challengeText"></p><button id="challengeAction">Go</button><progress id="challengeProgress" max="100" value="0"></progress></div></section><aside><button id="accessBtn">Accessories</button><br><button id="shopBtn" style="margin-top:10px">🛒 Shop</button><br><button id="sound" style="margin-top:10px">Sound: off</button></aside></div><div id="drawer" class="panel" hidden><div class="row"><h2 id="drawerTitle">Shop</h2><button id="close">Close</button></div><div class="grid" id="items"></div></div><p id="msg" class="message" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id);let clicks=0,power=1,auto=0,upCost=25,autoCost=50,multCost=100,current=3,sound=false,audio,mode='shop',challenge=null;const helmets=['Leather football cap','Plastic shell','Plastic shell with facemask','Vintage Riddell Kra-Lite TK2','Riddell Evolution','Schutt Air XP','Riddell Speed','RevoSpeed','Light LS2 Xenith Shadow','Riddell SpeedFlex','Schutt F7','Schutt F7 Air','Vicis Zero2','Riddell Axiom'];const owned=new Set([3]),access=new Set();let color='#b73536';
function say(t){$('msg').textContent=t}function tone(f=150){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.start();o.stop(audio.currentTime+.09)}catch{}}
function buy(cost,fn){if(clicks<cost)return say('Not enough clicks.');clicks-=cost;fn();tone(900);draw()}
function add(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('items').append(b)}
function draw(){ $('stats').textContent=`${Math.floor(clicks).toLocaleString()} clicks · +${power} per click · ${auto} per second`;$('helmetName').textContent=helmets[current];$('itemCount').textContent=`${owned.size} / ${helmets.length} helmets collected`;$('shell').setAttribute('fill',current===0?'#7f502c':color);$('mask').style.display=current<2?'none':'';$('items').innerHTML='';if(mode==='shop'){add(`+2 clicks — ${upCost}`,()=>buy(upCost,()=>{power+=2;upCost*=2}));add(`+1 autoclicker — ${autoCost}`,()=>buy(autoCost,()=>{auto++;autoCost*=2}));add(`×2 click multiplier — ${multCost}`,()=>buy(multCost,()=>{power*=2;multCost*=3}));helmets.forEach((name,i)=>{const cost=50*(i+1)**2;add(owned.has(i)?`Equip ${name}`:`${name} — ${cost}`,()=>{if(owned.has(i)){current=i;draw()}else buy(cost,()=>{owned.add(i);current=i})})})}else{[['White facemask',75,()=>{$('mask').setAttribute('stroke','#fff');$('mask').setAttribute('stroke-width','10')}],['Black facemask',75,()=>{$('mask').setAttribute('stroke','#222');$('mask').setAttribute('stroke-width','10')}],['Taped facemask',100,()=>{$('mask').setAttribute('stroke','#ddd');$('mask').setAttribute('stroke-width','15')}],['Blue visor',100,()=>$('visor').setAttribute('fill','#2ac9e6')],['Dark visor',100,()=>$('visor').setAttribute('fill','#000')],['Star sticker',50,()=>$('sticker').textContent='★'],['Red helmet',50,()=>color='#b73536'],['Blue helmet',50,()=>color='#315ab4'],['Gold helmet',75,()=>color='#d4aa37'],['Black chinstrap',50,()=>$('strap').setAttribute('stroke','#222')],['Mouthpiece',50,()=>$('mouth').setAttribute('fill','#39cc76')]].forEach(([name,cost,fn])=>add(access.has(name)?`Equip ${name}`:`${name} — ${cost}`,()=>{if(access.has(name)){fn();draw()}else buy(cost,()=>{access.add(name);fn()})}))}}
function open(m){mode=m;$('drawerTitle').textContent=m==='shop'?'Shop':'Accessories';$('drawer').hidden=false;draw()}
$('helmet').onclick=()=>{clicks+=power;tone();$('helmet').animate([{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:140});draw()};$('shopBtn').onclick=()=>open('shop');$('accessBtn').onclick=()=>open('access');$('close').onclick=()=>$('drawer').hidden=true;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Sound: '+(sound?'on':'off');tone()};
const names=['Lock up a receiver','Throwing dots','Kick a field goal','Run for a touchdown','Catch a pass','Oklahoma'];function nextChallenge(){if(challenge)return;challenge={name:names[Math.floor(Math.random()*names.length)],hits:0,end:Date.now()+8000};$('challenge').hidden=false;$('challengeName').textContent=challenge.name;$('challengeText').textContent='Complete this drill: press Go 10 times in 8 seconds for 100 clicks.';$('challengeProgress').value=0}
$('challengeAction').onclick=()=>{if(!challenge)return;challenge.hits++;$('challengeProgress').value=challenge.hits*10;if(challenge.hits>=10){clicks+=100;say(`${challenge.name} complete! +100 clicks.`);challenge=null;$('challenge').hidden=true;draw()}};setInterval(()=>{if(auto){clicks+=auto;draw()}if(challenge&&Date.now()>challenge.end){say('Drill time is up. Try the next challenge.');challenge=null;$('challenge').hidden=true}},1000);setInterval(nextChallenge,30000);draw();
</script></html>
