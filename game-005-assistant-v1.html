function renderHelmet(){$('shell').setAttribute('d',shellShapes[current]);$('clipShape').setAttribute('d',shellShapes[current]);$('shell').setAttribute('fill',current===0?'#7f502c':color);$('design').innerHTML=panels[current]+'<path d="M52 79Q89 27 155 40" fill="none" stroke="url(#shine)" stroke-width="10"/>';for(const id of ['mask','maskTape','visor','visorShine'])$(id).style.display=current<2?'none':''}
function say(t){$('msg').textContent=t}
function context(){audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}
function tone(f=900){if(!sound)return;try{const a=context(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.start();o.stop(a.currentTime+.09)}catch{}}
function helmetContact(){if(!sound)return;try{const a=context(),t=a.currentTime,b=a.createBuffer(1,a.sampleRate*.14,a.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.025));const n=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();n.buffer=b;filter.type='bandpass';filter.frequency.value=1700;filter.Q.value=.8;g.gain.value=.5;n.connect(filter);filter.connect(g);g.connect(a.destination);n.start(t);const o=a.createOscillator(),thud=a.createGain();o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(65,t+.12);thud.gain.setValueAtTime(.22,t);thud.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(thud);thud.connect(a.destination);o.start(t);o.stop(t+.15)}catch{}}
function buy(cost,fn){if(clicks<cost)return say('Not enough clicks.');clicks-=cost;fn();tone();draw()}

['Blue visor',300,()=>$('visor').setAttribute('fill','#2ac9e6')],['Dark visor',300,()=>$('visor').setAttribute('fill','#111827')],['Star sticker',150,()=>$('sticker').toggleAttribute('hidden',false)],['Red helmet',150,()=>color='#b73536'],['Blue helmet',150,()=>color='#315ab4'],['Gold helmet',225,()=>color='#d4aa37'],['Black chinstrap',150,()=>$('strap').setAttribute('stroke','#222')],['Mouthpiece',150,()=>$('mouth').toggleAttribute('hidden',false)]];
function draw(shop=true){$('stats').textContent=`${Math.floor(clicks).toLocaleString()} clicks · +${power} per click · ${auto} per second`;$('helmetName').textContent=helmets[current];$('itemCount').textContent=`${owned.size} / ${helmets.length} helmets collected`;renderHelmet();if($('drawer').hidden||!shop)return;$('items').replaceChildren();if(mode==='shop'){heading('Click power');add(`+2 clicks — ${upCost}`,()=>buy(upCost,()=>{power+=2;upCost*=2}));add(`×2 click multiplier — ${multCost}`,()=>buy(multCost,()=>{power*=2;multCost*=3}));multipliers.forEach(u=>add(`×${u.n} click multiplier — ${u.cost}`,()=>buy(u.cost,()=>{power*=u.n;u.cost*=u.n})));heading('Autoclickers · clicks per second');add(`+1 / second — ${autoCost}`,()=>buy(autoCost,()=>{auto++;autoCost*=2}));autoPacks.forEach(u=>add(`+${u.n} / second — ${u.cost}`,()=>buy(u.cost,()=>{auto+=u.n;u.cost*=3})));heading('Helmets · collection order');helmets.forEach((name,i)=>{const cost=150*(i+1)**2;add(owned.has(i)?`Equip ${name}`:`${name} — ${cost}`,()=>{if(owned.has(i)){current=i;draw()}else buy(cost,()=>{owned.add(i);current=i})},i===current?'Equipped':'Distinct shell and panel design')})}else{heading('Accessories · lowest price first');[...accessories].sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0])).forEach(([name,cost,fn])=>add(access.has(name)?`Equip ${name}`:`${name} — ${cost}`,()=>{if(access.has(name)){fn();draw()}else buy(cost,()=>{access.add(name);fn()})}))}}

// Football drills: player positions, ball flight, collisions and timed actions decide the result.
const drills=[
{name:'Lock up a receiver',text:'Blue is you. Stay with the red receiver. Jump (J) into the incoming pass to intercept, or tackle (Space) within reach after the catch. Move with arrows / WASD.',actions:['tackle','jump','sprint']},
{name:'Throwing dots',text:'Aim with arrows / WASD, or tap the field. Throw (Space) to lead the moving blue receiver. The pass must actually reach the receiver.',actions:['throw']},
{name:'Kick a field goal',text:'Aim the kick with arrows / WASD, or tap the field. Kick (Space) through the yellow uprights on the right.',actions:['kick']},
{name:'Run for a touchdown',text:'Carry the ball into the right end zone. Move with arrows / WASD. Sprint (Shift), jump (J), juke (Q) or truck (E) past the red defenders. Sprint uses stamina; trucking works head-on.',actions:['sprint','jump','juke','truck']},
{name:'Catch a pass',text:'Blue is you. Move to the gold landing marker. Catch (Space) as the pass arrives; jump (J) for extra reach. Arrows / WASD move you.',actions:['catch','jump','sprint']},
{name:'Oklahoma',text:'Blue is you. The red ball carrier tries to pass you. Move into reach, then tackle (Space). Sprint (Shift) to close the gap.',actions:['tackle','sprint']}];
const moves=new Set(),canvas=$('field'),ctx=canvas.getContext('2d');let drillFrame=0;
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),limit=(v,a,b)=>Math.max(a,Math.min(b,v));
function nextChallenge(index=Math.floor(Math.random()*drills.length)){if(challenge)return;challenge={index,phase:'ready'};$('challenge').hidden=false;$('challengeName').textContent=drills[index].name;$('challengeText').textContent=drills[index].text;$('drillStatus').textContent='Complete the drill for 100 clicks.';$('challengeProgress').value=0;$('challengeAction').hidden=false;$('challengeAction').textContent='Start drill';$('drillControls').hidden=true;drawField()}
function startDrill(){if(!challenge||challenge.phase!=='ready')return;const i=challenge.index;Object.assign(challenge,{phase:'playing',elapsed:0,last:performance.now(),duration:18,player:{x:i===4?360:i===0?245:75,y:145,jump:0,truck:0,juke:0,stamina:100},aim:{x:470,y:145},ball:null,receiver:{x:425,y:145},defenders:i===3?[{x:225,y:75,stun:0},{x:340,y:210,stun:0},{x:455,y:110,stun:0}]:[],runner:{x:480,y:145},sprint:false,cooldowns:{},passed:false,caught:false,catchUntil:0});moves.clear();$('challengeAction').hidden=true;$('drillControls').hidden=false;$('drillActions').replaceChildren();const labels={throw:'Throw [Space]',kick:'Kick [Space]',catch:'Catch [Space]',tackle:'Tackle [Space]',sprint:'Sprint [Shift]',jump:'Jump [J]',juke:'Juke [Q]',truck:'Truck [E]'};drills[i].actions.forEach(action=>{const b=document.createElement('button');b.textContent=labels[action];b.dataset.action=action;if(action==='sprint')b.setAttribute('aria-pressed','false');b.onclick=()=>drillAction(action);$('drillActions').append(b)});drillFrame=requestAnimationFrame(tickDrill)}
function finishDrill(won,reason){if(!challenge||challenge.phase!=='playing')return;challenge.phase='result';moves.clear();cancelAnimationFrame(drillFrame);$('drillControls').hidden=true;$('challengeAction').hidden=false;$('challengeAction').textContent='Close drill';$('drillStatus').textContent=reason+(won?' +100 clicks.':' Try the next drill.');if(won){clicks+=100;$('challengeProgress').value=100;draw();tone(800)}say(drills[challenge.index].name+': '+$('drillStatus').textContent);drawField()}
function launchBall(from,to,speed){let dx=to.x-from.x,dy=to.y-from.y,d=Math.hypot(dx,dy)||1;return{x:from.x,y:from.y,vx:dx/d*speed,vy:dy/d*speed,age:0}}
function drillAction(action){const s=challenge;if(!s||s.phase!=='playing'||!drills[s.index].actions.includes(action))return;const p=s.player;if(action==='sprint'){s.sprint=!s.sprint;const b=$('drillActions').querySelector('[data-action=sprint]');if(b)b.setAttribute('aria-pressed',String(s.sprint));return}if(s.cooldowns[action]>s.elapsed)return;if(action==='throw'||action==='kick'){if(s.ball)return;s.ball=launchBall(p,s.aim,action==='kick'?365:300);s.passed=true;s.cooldowns[action]=s.elapsed+1}else if(action==='jump'){p.jump=.75;s.cooldowns.jump=s.elapsed+1.4}else if(action==='juke'){p.juke=.35;const direction=moves.has('up')?-1:moves.has('down')?1:p.y>145?-1:1;p.y=limit(p.y+direction*42,20,270);s.cooldowns.juke=s.elapsed+1.8}else if(action==='truck'){p.truck=.55;s.cooldowns.truck=s.elapsed+2.1}else if(action==='catch'){s.catchUntil=s.elapsed+.5;s.cooldowns.catch=s.elapsed+.7;checkCatch()}else if(action==='tackle'){s.cooldowns.tackle=s.elapsed+.65;const target=s.index===5?s.runner:s.receiver;if(distance(p,target)<37&&(s.index===5||s.caught))finishDrill(true,'Clean tackle!');else $('drillStatus').textContent=s.index===0&&!s.caught?'Wait for the pass or jump to intercept.':'Tackle missed — move closer.'}drawField()}
function checkCatch(){const s=challenge;if(s&&s.index===4&&s.ball&&s.elapsed<=s.catchUntil&&s.ball.age>=1.1&&distance(s.player,s.ball)<(s.player.jump>0?48:28))finishDrill(true,s.player.jump>0?'Jumping catch!':'Pass caught!')}
function tickDrill(now){const s=challenge;if(!s||s.phase!=='playing')return;const dt=Math.min(.04,(now-s.last)/1000);s.last=now;s.elapsed+=dt;const p=s.player,i=s.index;let dx=Number(moves.has('right'))-Number(moves.has('left')),dy=Number(moves.has('down'))-Number(moves.has('up'));let length=Math.hypot(dx,dy)||1;dx/=length;dy/=length;
if(i===1||i===2){s.aim.x=limit(s.aim.x+dx*150*dt,130,550);s.aim.y=limit(s.aim.y+dy*150*dt,15,275)}else{let sprint=s.sprint&&p.stamina>0,speed=sprint?156:100;p.stamina=limit(p.stamina+(sprint?-37:24)*dt,0,100);p.x=limit(p.x+dx*speed*dt,18,542);p.y=limit(p.y+dy*speed*dt,18,272)}for(const key of ['jump','truck','juke'])p[key]=Math.max(0,p[key]-dt);
if(i===1)s.receiver.y=145+Math.sin(s.elapsed*1.6)*91;
if(i===0){s.receiver.x=305+Math.min(110,s.elapsed*10);s.receiver.y=145+Math.sin(s.elapsed*1.2)*75;if(!s.passed&&s.elapsed>2){s.ball=launchBall({x:45,y:145},{x:305+Math.min(110,(s.elapsed+1.5)*10),y:145+Math.sin((s.elapsed+1.5)*1.2)*75},200);s.passed=true}if(s.caught){s.receiver.x+=s.elapsed*5;if(s.receiver.x>530)finishDrill(false,'The receiver escaped.')}}
if(i===4&&!s.passed&&s.elapsed>1){s.aim={x:420,y:70+Math.random()*150};s.ball=launchBall({x:55,y:145},s.aim,180);s.passed=true}
if(i===5){s.runner.x-=70*dt;s.runner.y=145+Math.sin(s.elapsed*1.8)*55;if(s.runner.x<20)finishDrill(false,'The ball carrier got past you.')}
if(i===3){for(const d of s.defenders){d.stun=Math.max(0,d.stun-dt);if(d.stun)continue;const dist=distance(p,d)||1;if(dist<190){d.x+=(p.x-d.x)/dist*45*dt;d.y+=(p.y-d.y)/dist*45*dt}if(dist<26){if(p.truck>0&&d.x>=p.x-8&&Math.abs(d.y-p.y)<24){d.stun=2.3;d.x+=35;$('drillStatus').textContent='Trucked the defender!'}else if(p.jump<=0&&p.juke<=0)finishDrill(false,'Tackled! Time your jump, juke or truck.')}}if(p.x>=525)finishDrill(true,'Touchdown!')}
if(s.ball&&s.phase==='playing'){const b=s.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;b.age+=dt;if(i===1&&distance(b,s.receiver)<25)finishDrill(true,'The receiver caught your pass!');else if(i===0){if(p.jump>0&&distance(p,b)<38)finishDrill(true,'Pass intercepted!');else if(distance(b,s.receiver)<28){s.caught=true;s.ball=null;$('drillStatus').textContent='Pass caught — tackle the receiver!'}}else if(i===2&&b.x>=510){finishDrill(b.y>=94&&b.y<=196,b.y>=94&&b.y<=196?'Field goal!':'The kick missed the uprights.')}else if(i===4){checkCatch();if(s.phase==='playing'&&distance(b,s.aim)<10){s.ball=null;finishDrill(false,'Incomplete pass — catch as it reaches the marker.')}}if(s.ball&&(b.x<0||b.x>560||b.y<0||b.y>290||b.age>4)&&s.phase==='playing')finishDrill(false,'Incomplete pass.')}
if(s.phase!=='playing')return;if(s.elapsed>=s.duration){finishDrill(false,'Time is up.');return}$('challengeProgress').value=s.elapsed/s.duration*100;$('drillStatus').textContent=(s.duration-s.elapsed).toFixed(1)+' seconds'+(drills[i].actions.includes('sprint')?' · stamina '+Math.round(p.stamina)+'%':'');drawField();drillFrame=requestAnimationFrame(tickDrill)}
function football(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(-.45);ctx.fillStyle='#9b552a';ctx.beginPath();ctx.ellipse(0,0,10,6,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);for(let z=-3;z<=3;z+=3){ctx.moveTo(z,-3);ctx.lineTo(z,3)}ctx.stroke();ctx.restore()}
function playerSprite(p,team,ball=false,label=''){const s=challenge,jump=p.jump>0?Math.sin(p.jump/.75*Math.PI)*15:0;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,11,13,5,0,0,Math.PI*2);ctx.fill();ctx.translate(0,-jump);const step=s&&s.phase==='playing'?Math.sin(s.elapsed*12+p.x)*4:0;ctx.strokeStyle='#182536';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,6);ctx.lineTo(-7,17+step);ctx.moveTo(5,6);ctx.lineTo(7,17-step);ctx.stroke();ctx.fillStyle=team;ctx.fillRect(-10,-9,20,19);ctx.strokeStyle=team;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(-17,p.truck>0?-12:4);ctx.moveTo(10,-5);ctx.lineTo(17,p.jump>0?-20:4);ctx.stroke();ctx.fillStyle='#f1e4c8';ctx.beginPath();ctx.arc(0,-17,10,0,Math.PI*2);ctx.fill();ctx.fillStyle=team;ctx.beginPath();ctx.arc(0,-20,10,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#e7edf4';ctx.lineWidth=2;ctx.strokeRect(-9,-20,18,7);ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('7',0,4);if(ball)football(14,-2);ctx.restore();if(label){ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(label,p.x,p.y+34)}}
function drawField(){ctx.clearRect(0,0,560,290);ctx.fillStyle='#28603b';ctx.fillRect(0,0,560,290);for(let x=40;x<540;x+=50){ctx.fillStyle=x%100===40?'#ffffff08':'#00000008';ctx.fillRect(x,0,50,290);ctx.strokeStyle='#ffffff80';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,8);ctx.lineTo(x,282);ctx.stroke();for(let y=65;y<=225;y+=40){ctx.fillStyle='#fff9';ctx.fillRect(x-3,y,6,2)}}ctx.fillStyle='#ffffff20';ctx.fillRect(520,0,40,290);ctx.strokeStyle='#fff';ctx.strokeRect(8,8,544,274);const s=challenge;if(!s||s.phase==='ready'){playerSprite({x:90,y:145},'#4ba7ff',true,'YOU');playerSprite({x:400,y:145},'#dc5757',false,'RIVAL');return}const i=s.index;if(i===2){ctx.strokeStyle='#ffe55b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(515,94);ctx.lineTo(515,196);ctx.moveTo(515,94);ctx.lineTo(543,94);ctx.moveTo(515,196);ctx.lineTo(543,196);ctx.stroke()}if(i===1||i===2||i===4){ctx.strokeStyle='#ffe16b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.aim.x,s.aim.y,15,0,Math.PI*2);ctx.moveTo(s.aim.x-21,s.aim.y);ctx.lineTo(s.aim.x+21,s.aim.y);ctx.moveTo(s.aim.x,s.aim.y-21);ctx.lineTo(s.aim.x,s.aim.y+21);ctx.stroke()}if(i===1||i===0)playerSprite(s.receiver,i===1?'#4ba7ff':'#dc5757',s.caught,'RECEIVER');if(i===0||i===4)playerSprite({x:45,y:145},i===0?'#dc5757':'#4ba7ff',!s.passed,'QB');if(i===5)playerSprite(s.runner,'#dc5757',true,'RUNNER');for(const d of s.defenders){ctx.globalAlpha=d.stun?.4:1;playerSprite(d,'#dc5757');ctx.globalAlpha=1}playerSprite(s.player,'#4ba7ff',i===3||((i===1||i===2)&&!s.passed),'YOU');if(s.ball)football(s.ball.x,s.ball.y)}
$('challengeAction').onclick=()=>{if(challenge?.phase==='ready')startDrill();else{challenge=null;$('challenge').hidden=true}};
const keyMoves={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
document.addEventListener('keydown',e=>{if(!challenge||challenge.phase!=='playing'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const key=keyMoves[e.key];if(key){e.preventDefault();moves.add(key)}if(e.repeat)return;let action=e.code==='Space'?drills[challenge.index].actions.find(a=>['throw','kick','catch','tackle'].includes(a)):e.key==='Shift'?'sprint':({j:'jump',q:'juke',e:'truck'})[e.key.toLowerCase()];if(action){e.preventDefault();if(action==='sprint'){if(!challenge.sprint)drillAction(action)}else drillAction(action)}});document.addEventListener('keyup',e=>{const key=keyMoves[e.key];if(key)moves.delete(key);if(e.key==='Shift'&&challenge?.sprint)drillAction('sprint')});window.addEventListener('blur',()=>{moves.clear();if(challenge?.sprint)drillAction('sprint')});document.querySelectorAll('[data-move]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);moves.add(b.dataset.move)};for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>moves.delete(b.dataset.move))});canvas.onpointerdown=e=>{if(!challenge||challenge.phase!=='playing'||![1,2].includes(challenge.index))return;const r=canvas.getBoundingClientRect();challenge.aim={x:limit((e.clientX-r.left)*560/r.width,130,550),y:limit((e.clientY-r.top)*290/r.height,15,275)}};
let lastAuto=performance.now();setInterval(()=>{const now=performance.now(),dt=(now-lastAuto)/1000;lastAuto=now;if(auto){clicks+=auto*dt;draw(false)}},100);setInterval(()=>nextChallenge(),30000);draw();
</script></body></html>
