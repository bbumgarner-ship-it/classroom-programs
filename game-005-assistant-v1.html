function renderHelmet(){const h=helmetArt[current];$('shell').setAttribute('d',h.shell);$('clipShape').setAttribute('d',h.shell);$('shell').setAttribute('fill',current===0?h.color:color||h.color);$('design').innerHTML=h.panels+'<path d="'+h.shell+'" fill="url(#shellLight)"/>';$('faceOpening').setAttribute('d',current===0?'M85 125Q150 113 215 125L210 174Q150 157 90 174Z':'M68 118Q150 101 232 118L217 178Q150 209 83 178Z');$('faceOpening').setAttribute('fill',current===0?'#59351e':'#182027');$('mask').setAttribute('d',h.mask);$('mask').setAttribute('stroke',maskColor||h.maskColor||'#d9dddf');$('visor').setAttribute('fill',visorColor||'#17232e');$('visor').setAttribute('opacity',visorColor?'.85':current===13?'.9':'.18');for(const id of ['mask','maskTape','visor','visorShine','strap'])$(id).style.display=current<2?'none':''}

function context(){audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}
function tone(f=900){if(!sound)return;try{const a=context(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.start();o.stop(a.currentTime+.09)}catch{}}

function startDrill(){if(!challenge||challenge.phase!=='ready')return;const i=challenge.index;Object.assign(challenge,{phase:'playing',elapsed:0,last:performance.now(),duration:18,player:{x:i===4?360:i===0?245:75,y:145,jump:0,truck:0,juke:0,stamina:100},aim:{x:470,y:145},ball:null,receiver:{x:425,y:145},defenders:i===3?[{x:225,y:75,stun:0},{x:340,y:210,stun:0},{x:455,y:110,stun:0}]:[],runner:{x:480,y:145},sprint:false,cooldowns:{},passed:false,caught:false,catchUntil:0});moves.clear();$('challengeAction').hidden=true;$('drillControls').hidden=false;$('drillActions').replaceChildren();const labels={throw:'Throw [Space]',kick:'Kick [Space]',catch:'Catch [Space]',tackle:'Tackle [Space]',sprint:'Sprint [Shift]',jump:'Jump [J]',juke:'Juke [Q]',truck:'Truck [E]'};drills[i].actions.forEach(action=>{const b=document.createElement('button');b.textContent=labels[action];b.dataset.action=action;if(action==='sprint')b.setAttribute('aria-pressed','false');b.onclick=()=>drillAction(action);$('drillActions').append(b)});drillFrame=requestAnimationFrame(tickDrill)}

else if(a==='tackle'||a==='hitstick'){const target=s.carrier;if(a==='hitstick'&&p.stamina<25){scrimmageNotice('Hitstick needs 25 stamina.');return}p.tackleAnim=.6;s.cooldowns[a]=s.elapsed+(a==='hitstick'?2.8:.9);if(a==='hitstick'){p.stamina-=25;if(target){const d=distance(p,target)||1;p.x=limit(p.x+(target.x-p.x)/d*14,18,542);p.y=limit(p.y+(target.y-p.y)/d*14,18,272)}}if(target&&distance(p,target)<(a==='hitstick'?42:32)){target.fall=1.1;target.hasBall=false;endScrimmagePlay(a==='hitstick'?'turnover':'tackle',a==='hitstick'?'Hitstick forces a fumble!':'Tackle made.')}else{p.stun=a==='hitstick'?.65:.2;scrimmageNotice('Missed — get within reach of the ball carrier.')}}drawField()}
function checkScrimmageCatch(){const s=challenge;if(!s||s.kind!=='scrimmage'||s.phase!=='playing'||s.control!=='receiver'||!s.ball||s.catchUntil<s.elapsed||s.ball.age<.3)return;const p=s.player,reach=s.catchKind==='onehand'?54:s.catchKind==='impressive'?45:p.jump>0?38:25;if(distance(p,s.ball)<=reach){s.ball=null;p.hasBall=true;s.carrier=p;s.control='carrier';p.catchAnim=.8;scrimmageNotice(s.catchKind==='onehand'?'One-hand catch! Run for the end zone.':s.catchKind==='impressive'?'Diving catch! Run for the end zone.':p.jump>0?'Jumping catch!':'Pass secured!');renderScrimmageControls()}}
function checkScrimmageInterception(){const s=challenge;if(!s||s.kind!=='scrimmage'||s.phase!=='playing'||s.control!=='defender'||!s.ball||s.interceptUntil<s.elapsed)return;const p=s.player;if(distance(p,s.ball)<(p.jump>0?49:28)){s.ball=null;p.hasBall=true;p.catchAnim=.9;endScrimmagePlay('turnover','Intercepted! Your team takes possession.')}}
function allScrimmageActors(s){return[...new Set([s.player,s.qb,s.runner,...s.receivers,...s.blockers,...s.defenders])]}
function chase(a,b,speed,dt){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;a.x=limit(a.x+dx/d*speed*dt,18,542);a.y=limit(a.y+dy/d*speed*dt,18,272);a.moving=true}
function carrierContact(s,d){const p=s.player;if(d.stun>0||distance(p,d)>25)return;if(p.truck>0&&d.x>=p.x-8&&Math.abs(d.y-p.y)<25){d.stun=1.6;d.fall=.7;d.x=limit(d.x+32,18,542);p.truck=0;scrimmageNotice('Trucked through the tackle!');return}if(p.hurdle>0&&d.style==='low'){d.stun=.7;scrimmageNotice('Hurdled the low tackle!');return}if(p.spin>0&&!p.spinUsed){p.spinUsed=true;d.stun=1.1;p.x=limit(p.x+24,18,542);scrimmageNotice('Spin move escapes contact!');return}if(p.juke>0)return;d.tackleAnim=.6;p.fall=1.1;if(d.style==='strip'&&!p.tucked){p.hasBall=false;endScrimmagePlay('fumble','Stripped! Tucking protects the ball in contact.')}else endScrimmagePlay('tackle',p.tucked?'Ball secured through contact. Tackled.':'Tackled. Next down.')}
function tickScrimmage(now){const s=challenge;if(!s||s.kind!=='scrimmage'||s.phase!=='playing')return;const dt=Math.min(.04,(now-s.last)/1000);s.last=now;s.elapsed+=dt;s.playTime+=dt;const p=s.player;for(const a of allScrimmageActors(s)){a.moving=false;for(const k of ['jump','hurdle','spin','juke','truck','throwAnim','tackleAnim','catchAnim','fall','stun','dive'])a[k]=Math.max(0,(a[k]||0)-dt)}let dx=Number(moves.has('right'))-Number(moves.has('left')),dy=Number(moves.has('down'))-Number(moves.has('up')),d=Math.hypot(dx,dy)||1;const sprint=s.sprint&&p.stamina>0;if(p.stun<=0){const speed=(sprint?150:98)*(p.tucked?.77:1)*(p.dive>0?.4:1);p.x=limit(p.x+dx/d*speed*dt,18,542);p.y=limit(p.y+dy/d*speed*dt,20,270);p.moving=Boolean(dx||dy)}p.stamina=limit(p.stamina+(sprint&&p.moving?-32:19)*dt,0,100);if(p.stamina===0)s.sprint=false;
const defense=s.role==='defender';for(let n=0;n<s.receivers.length;n++){const r=s.receivers[n];if(s.carrier===r)continue;r.x=limit(r.x+(defense?-62:65)*dt,35,510);r.y=65+n*160+Math.sin(s.playTime*1.5+n)*18;r.moving=true}
if(!defense){if(s.control==='qb'&&p.x>s.line+28&&p.hasBall){s.control='carrier';renderScrimmageControls();scrimmageNotice('Across the line — carry the ball!')}
for(const defender of s.defenders){if(defender.stun>0)continue;const target=s.carrier||s.player;chase(defender,target,defender.style==='strip'?62:55,dt);for(const blocker of s.blockers){if(blocker.stun<=0&&distance(blocker,defender)<28){defender.stun=.9;blocker.stun=1.3;blocker.tackleAnim=.5;defender.x+=15}}if(s.carrier===p)carrierContact(s,defender)}
if(s.role==='receiver'&&!s.passed&&s.playTime>1.8){s.ball=launchBall(s.qb,s.aim,190);s.ball.team=s.ourColor;s.passed=true;s.qb.hasBall=false;s.qb.throwAnim=.55;scrimmageNotice('Pass incoming — get to the marker!')}
if(p.hasBall&&p.x>=525){endScrimmagePlay('touchdown','Touchdown!');return}
}else{if(!s.passed&&s.playTime>1.5){s.passed=true;s.qb.hasBall=false;if(s.down%2===0){s.runner.hasBall=true;s.carrier=s.runner}else{const r=s.receivers[0],flight=distance(s.qb,r)/215;s.ball=launchBall(s.qb,{x:limit(r.x-62*flight,35,510),y:65+Math.sin((s.playTime+flight)*1.5)*18},215);s.ball.team=s.theirColor;s.ball.target=r;s.qb.throwAnim=.55}}if(s.carrier){s.carrier.x-=66*dt;s.carrier.y+=Math.sin(s.playTime*2)*18*dt;s.carrier.moving=true;if(s.carrier.x<=35){endScrimmagePlay('touchdown','The opposing team scores.');return}for(const teammate of s.defenders){if(teammate.stun<=0){chase(teammate,s.carrier,40,dt);if(distance(teammate,s.carrier)<22){s.carrier.fall=1;teammate.tackleAnim=.6;endScrimmagePlay('tackle','Your teammate makes the tackle.');return}}}}for(const blocker of s.blockers){chase(blocker,p,25,dt);if(distance(blocker,p)<24&&p.jump<=0){p.x-=12*dt;blocker.tackleAnim=.3}}}
if(s.phase!=='playing')return;
if(s.ball){const b=s.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;b.age+=dt;if(defense){checkScrimmageInterception();if(s.phase!=='playing')return;for(const r of s.receivers)if(distance(r,b)<25){r.hasBall=true;r.catchAnim=.6;s.carrier=r;s.ball=null;scrimmageNotice('Pass completed — stop the runner!');break}}else if(s.control==='receiver')checkScrimmageCatch();else{for(const r of s.receivers)if(distance(r,b)<25){s.player.hasBall=false;r.hasBall=true;r.catchAnim=.6;s.player=r;s.carrier=r;s.control='carrier';s.ball=null;renderScrimmageControls();scrimmageNotice('Completed! You now control the receiver.');break}if(s.ball)for(const defender of s.defenders)if(defender.stun<=0&&b.age>.25&&distance(defender,b)<19){defender.hasBall=true;defender.catchAnim=.7;s.ball=null;endScrimmagePlay('fumble','Pass intercepted by the defense.');break}}
if(s.ball&&(b.x<12||b.x>548||b.y<12||b.y>278||b.age>4)){s.ball=null;endScrimmagePlay('incomplete','Incomplete pass.')}}
if(s.phase!=='playing')return;if(s.elapsed>=s.duration){endScrimmagePlay('timeout','Scrimmage time is up.');return}$('challengeProgress').value=s.elapsed/s.duration*100;$('drillStatus').textContent=`Down ${s.down}/4 · ${defense?'Stop the left-bound offense':'Reach the gold first-down line'} · ${Math.ceil(s.duration-s.elapsed)}s · Stamina ${Math.round(s.player.stamina)}%`+(s.noticeUntil>s.elapsed?' · '+s.notice:'');drawField();drillFrame=requestAnimationFrame(tickScrimmage)}
function endScrimmagePlay(outcome,reason){const s=challenge;if(!s||s.phase!=='playing')return;const defense=s.role==='defender';s.phase='whistle';moves.clear();cancelAnimationFrame(drillFrame);s.sprint=false;if(outcome==='touchdown'){s.points[defense?1:0]=6;s.terminal=true;s.won=!defense}else if(outcome==='fumble'||outcome==='turnover'){s.terminal=true;s.won=defense&&outcome==='turnover'}else if(outcome==='timeout'){s.terminal=true;s.won=false}else{if(outcome==='tackle'){s.line=defense?Math.min(s.line,s.carrier?.x??s.line):Math.max(s.line,s.player.x);const first=defense?s.line<=s.firstDown:s.line>=s.firstDown;if(first){s.down=1;s.firstDown=defense?Math.max(35,s.line-100):Math.min(525,s.line+100);reason+=' First down.'}else s.down++}else s.down++;if(s.down>4){s.terminal=true;s.won=defense;reason+=defense?' Turnover on downs — defense holds!':' Turnover on downs.'}}
if(s.terminal&&s.won){clicks+=100;draw(false);reason+=' +100 clicks.';tone(800)}s.resultText=reason;$('drillStatus').textContent=reason+' Score '+s.points[0]+'–'+s.points[1];$('drillControls').hidden=true;$('challengeAction').hidden=false;$('challengeAction').textContent=s.terminal?'Close scrimmage':'Next down';say(reason);drawField();animateWhistle(s)}
function animateWhistle(s){let previous=performance.now(),remaining=.75;function frame(now){if(challenge!==s||!['whistle','result'].includes(s.phase))return;const dt=Math.min(.04,(now-previous)/1000);previous=now;remaining-=dt;s.elapsed+=dt;const actors=s.kind==='scrimmage'?allScrimmageActors(s):[s.player,s.runner,s.receiver,...s.defenders];for(const a of actors){a.moving=false;for(const k of ['tackleAnim','throwAnim','catchAnim','fall'])a[k]=Math.max(0,(a[k]||0)-dt)}drawField();if(remaining>0)drillFrame=requestAnimationFrame(frame)}drillFrame=requestAnimationFrame(frame)}
function drawScrimmageField(){const s=challenge;drawTurf();ctx.strokeStyle='#79caff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.line,10);ctx.lineTo(s.line,280);ctx.stroke();ctx.strokeStyle='#ffe16b';ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(s.firstDown,10);ctx.lineTo(s.firstDown,280);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('SCRIMMAGE · '+scrimmageRoles[s.role].name+' · DOWN '+Math.min(s.down,4),280,21);if(s.control==='receiver'&&!s.player.hasBall){ctx.strokeStyle='#ffe16b';ctx.beginPath();ctx.arc(s.aim.x,s.aim.y,19,0,Math.PI*2);ctx.stroke()}if(s.control==='qb'){const r=s.receivers[s.selected];ctx.strokeStyle='#ffe16b';ctx.beginPath();ctx.arc(r.x,r.y,23,0,Math.PI*2);ctx.stroke()}for(const b of s.blockers)playerSprite(b,b.team,false,'LINE');for(const r of s.receivers)if(r!==s.player)playerSprite(r,r.team,r.hasBall,'WR');for(const d of s.defenders)playerSprite(d,d.team,d.hasBall,d.style==='strip'?'STRIP':d.style==='low'?'LOW':'DEF');if(s.role==='receiver'||s.role==='defender')playerSprite(s.qb,s.qb.team,s.qb.hasBall,'QB');if(s.role==='defender'&&s.down%2===0)playerSprite(s.runner,s.runner.team,s.runner.hasBall,'RB');playerSprite(s.player,s.player.team,s.player.hasBall,'YOU');if(s.ball)football(s.ball.x,s.ball.y)}

$('scrimmageBtn').onclick=openScrimmage;$('closeScrimmageMenu').onclick=()=>$('scrimmageMenu').hidden=true;$('scrimmageTeam').onchange=e=>chosenTeam=e.target.value;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>startScrimmage(b.dataset.role));
let lastAuto=performance.now();setInterval(()=>{const now=performance.now(),dt=(now-lastAuto)/1000;lastAuto=now;if(auto){clicks+=auto*dt;draw(false)}},100);setInterval(()=>nextChallenge(),30000);draw();
</script></body></html>
